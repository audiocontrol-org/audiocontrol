name: Test

on:
  push:
  pull_request:

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit, UI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Skip devenv inside Make targets — CI runner already has Node/pnpm/system libs.
      DEVENV_RUN: bash -c
      # Pin Playwright browsers cache path so we can hit the actions cache.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      # Set for downstream tools that detect CI (Playwright configs use it for
      # `forbidOnly` / `retries`; vitest configs may use it for reporter
      # selection). GitHub Actions sets this automatically too — declaring it
      # here just makes the contract explicit.
      CI: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Belt-and-braces with `packageManager` in root package.json: explicit
          # pin in the workflow keeps this readable + survives any future
          # packageManager-field churn.
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @audiocontrol/e2e-infra exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @audiocontrol/e2e-infra exec playwright install-deps chromium

      - name: Build all modules
        run: make

      # Phase 0 unit tests for the modules whose surface we modified:
      #   * sampler-devices  — recording / replay / simulation infra + S-330/S-550
      #     SysEx, minus the s3000xl/ subtree which has 3 pre-existing failures
      #     (s3000xl-client REPLY-error handling + akai-translation translation
      #     drift) tracked separately in #406.
      #   * roland-sxx0-editor — including the simulated-transport tests added
      #     in Phase 0 Task 7.
      #   * editor-core — minus PluginLibraryBrowser + MoveDialog tests (6
      #     pre-existing failures predating Phase 0). Tracked in #406.
      # Each step is split out so the exclude scope is local and obvious.
      # Once #406 is resolved, drop the `--exclude` flags and eventually
      # collapse back to a single `pnpm test` across the workspace.
      - name: Unit tests — sampler-devices (excluding s3000xl pre-existing failures)
        run: pnpm --filter @audiocontrol/sampler-devices exec vitest run --exclude '**/s3000xl/**'

      - name: Unit tests — roland-sxx0-editor
        run: pnpm --filter @audiocontrol/roland-sxx0-editor test

      - name: Unit tests — editor-core (excluding PluginLibraryBrowser/MoveDialog pre-existing failures)
        run: pnpm --filter @audiocontrol/editor-core exec vitest run --exclude '**/{PluginLibraryBrowser,MoveDialog}.test.tsx'

      - name: UI tests — Roland (Phase 0 simulated harness)
        run: make test-ui-roland

      - name: UI tests — S3K (keygroup harness)
        run: make test-ui-s3k

      - name: Upload Playwright traces / screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            modules/roland-sxx0-editor/test-results/**
            modules/roland-sxx0-editor/playwright-report/**
            modules/akai-s3k-editor/test-results/**
            modules/akai-s3k-editor/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
