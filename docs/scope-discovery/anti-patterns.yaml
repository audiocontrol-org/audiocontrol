# Anti-pattern registry — Phase 6 T6.1
#
# Each refactor commit that EXTRACTS a primitive SHOULD append an entry here
# naming the structural shape the primitive replaces. Future commits introducing
# code that matches the shape will be flagged with the suggested replacement.
#
# This closes the gap the clone detector misses: regime drift that doesn't
# match a token-level clone signature. The clone detector catches copy-paste;
# this registry catches "agent reimplemented the same shape from scratch."
#
# ──────────────────────────────────────────────────────────────────────────
# Schema
# ──────────────────────────────────────────────────────────────────────────
#
#   - id: <kebab-case-id; unique across the registry>
#     added_in: <commit-sha; 7-40 lowercase hex>
#     primitive: <component or hook name; e.g., useExportDialogLifecycle>
#     from: <import path of the primitive; e.g., '@/hooks/useExportDialogLifecycle'>
#     shape_regex: <single regex string OR list of regex strings>
#       # When a list, ALL patterns must match the same file within
#       # `min_distance` source lines of each other. Use a list to fingerprint
#       # multi-line shapes (e.g. "useState for `open` + closeOnEsc effect +
#       # backdrop click handler" — three patterns that together identify the
#       # SlideDrawer legacy shape, without false-positiving on the individual
#       # patterns).
#     min_distance: <integer; max line gap between match positions when
#       shape_regex is a list. Defaults to 50. Ignored when shape_regex is
#       a single regex string.>
#     excludes_paths: <optional list of literal repo-relative paths or
#       globs (CWD-relative POSIX form). Files whose path matches any
#       entry are skipped for THIS anti-pattern only; other entries
#       still scan them normally. Primary use case: the canonical
#       primitive's own file, whose body IS the legacy shape the entry
#       catches. Secondary use case: test fixtures intentionally
#       carrying the legacy shape as evidence. Empty list OR missing
#       field => no exclusions. Glob syntax matches util/glob.ts
#       (e.g., `**/*.tsx`, `lib/{Foo,Bar}.ts`).>
#     canonical_implementation_file: <optional CWD-relative POSIX path
#       (AUDIT-20260524-08). Names the canonical primitive's CURRENT
#       source-of-truth file. The scanner auto-excludes that file from
#       this entry's shape match (it would otherwise self-flag — its
#       body IS the legacy shape, by construction). When the field is
#       set AND the file does not exist at scan time, the scanner
#       FAILS LOUD with an actionable error naming the entry id and
#       the missing path — typically caused by a git rename without
#       registry update. Independent from `excludes_paths:`: when both
#       are set, both apply (auto-exclude PLUS the globs). Use this
#       instead of repeating the canonical's path in `excludes_paths:`
#       so a future primitive relocation is detected loudly rather
#       than silently masking the new canonical as a holdout.>
#     message: <multi-line replacement instruction; what an agent should do
#       when this shape is found>
#
# Regex notes:
# - Patterns are compiled with `gm` flags (global + multi-line; ^/$ match
#   per-line). Use `\\b`-anchored token boundaries for identifiers to avoid
#   substring false positives.
# - Patterns are matched against the file contents as a single UTF-8 string.
# - Pattern strings travel through YAML; escape backslashes per YAML rules
#   (prefer single-quoted YAML strings to avoid double-escaping).
# - The `shape_regex` is a fingerprint, NOT a full AST. If a pattern is
#   prone to false positives, add a sibling pattern via the list form so the
#   gate requires both shapes co-occurring within `min_distance` lines.
#
# Engine choice (documented inline for future agents):
#   Pure-regex over `ast-grep`. The repo doesn't carry an ast-grep binary or
#   wrapper; adding one for v1 widens the dep surface for marginal benefit.
#   When `shape_regex` is a list with `min_distance`, multi-line fingerprints
#   are precise enough to match what the feedback's ast-grep example would
#   catch. If a future entry truly needs full AST matching, that's the moment
#   to add the dep — not before.
#
# Pre-commit hook (`make check-anti-patterns`) walks this registry on every
# .ts/.tsx change and flags any matching shape in the staged tree. See
# `tools/scope-discovery/check-anti-patterns.ts` for the gate.

# roland-bugfix Phase 4 backfill (2026-05-23, post-PR-#454):
# T6.1's `excludes_paths:` field shipped in commit 914710a2 closing #451.
# Backfilled the 9 anti-pattern drafts from Phase 2's refactor extractions;
# each entry's `excludes_paths:` lists the canonical primitive's own file
# so the scan correctly skips the source-of-truth definition.

anti_patterns:
  - id: use-export-dialog-lifecycle-inline
    added_in: dce8fc72
    primitive: useExportDialogLifecycle
    from: '@/hooks/useExportDialogLifecycle'
    shape_regex:
      - 'const \[localError, setLocalError\] = useState<string \| null>\(null\)'
      - 'const \[hasStarted, setHasStarted\] = useState\(false\)'
    min_distance: 10
    excludes_paths:
      - 'modules/roland-sxx0-editor/src/hooks/useExportDialogLifecycle.ts'
    message: |
      Inline localError + hasStarted state with open-reset useEffect was
      promoted to the useExportDialogLifecycle hook in commit dce8fc72.
      Replace with `const { localError, setLocalError, hasStarted, ... } =
      useExportDialogLifecycle({ open, isOperating, progress, operationError,
      onOpenChange });`

  - id: page-title-row-inline
    added_in: b996aa01
    primitive: PageTitleRow
    # Promoted to editor-core in akai-harmonization Phase 2 task 2.2 —
    # canonical import path now '@audiocontrol/editor-core' for cross-editor
    # consumption. The old '@/components/common/PageTitleRow' path resolves
    # to the same component while it's re-exported from the roland alias.
    from: '@audiocontrol/editor-core'
    shape_regex: '<header[^>]*className="ac-page-title-row"'
    excludes_paths:
      # Canonical component file (moved from roland to editor-core in
      # akai-harmonization Phase 2 task 2.2).
      - 'modules/editor-core/src/components/PageTitleRow.tsx'
      # HomePage migrated via RGM-001 sub-task 1 (PageTitleRow extension
      # added showLed?: boolean + optional isLoading/refreshLabel).
      # LibraryPage migrated via RGM-001 sub-task 2 (PageTitleRow extension
      # added headingNode?: ReactNode + actions?: ReactNode slot).
    message: |
      Inline `.ac-page-title-row` markup was promoted to the PageTitleRow
      component in commit b996aa01 (then moved to editor-core in
      akai-harmonization Phase 2 task 2.2). Replace with
      `<PageTitleRow headingId="..." headingText="..." metric={...}
      loadingMessage={...} isLoading={...} onRefresh={...}
      refreshLabel="..." />` imported from `@audiocontrol/editor-core`.

  - id: ac-reload-icon-inline
    added_in: b996aa01
    primitive: AcReloadIcon
    # Promoted to editor-core in akai-harmonization Phase 2 task 2.2.
    from: '@audiocontrol/editor-core'
    shape_regex:
      - '<svg viewBox="0 0 16 16" aria-hidden="true">'
      - 'M3 8a5 5 0 0 1 9-3'
      - 'M13 8a5 5 0 0 1-9 3'
    min_distance: 10
    excludes_paths:
      # Canonical component file (moved from roland to editor-core in
      # akai-harmonization Phase 2 task 2.2).
      - 'modules/editor-core/src/components/AcReloadIcon.tsx'
      # LibraryPage closed via RGM-001 sub-task 2 — now adopts PageTitleRow
      # which uses AcReloadIcon internally for its refresh button.
    message: |
      Inline 4-path reload SVG was promoted to the AcReloadIcon component
      in commit b996aa01. Replace with `<AcReloadIcon />`.

  - id: bank-header-inline
    added_in: c88d8d06
    primitive: BankHeader
    from: '@/components/common/BankHeader'
    shape_regex: '<div className="ac-list-bank-header">'
    excludes_paths:
      - 'modules/roland-sxx0-editor/src/components/common/BankHeader.tsx'
    message: |
      Inline `.ac-list-bank-header` markup was promoted to the BankHeader
      component in commit c88d8d06. Replace with `<BankHeader bankIndex={...}
      firstSlotLabel={...} lastSlotLabel={...} isCollapsed={...}
      onToggle={...} isBankLoaded={...} isThisBankLoading={...}
      onReload={...} testIdPrefix={...} />`.

  - id: slot-info-inline
    added_in: 30e7346e
    primitive: SlotInfo
    from: '@/components/common/SlotInfo'
    shape_regex: '<span className="ac-list-info">'
    excludes_paths:
      - 'modules/roland-sxx0-editor/src/components/common/SlotInfo.tsx'
      # DeviceMemoryPanel migrated via RGM-001 sub-task 3 (SlotInfo
      # extension added dragOverText?: string + isDragOver?: boolean +
      # optional testId).
    message: |
      Inline `.ac-list-info` span block was promoted to the SlotInfo
      component in commit 30e7346e. Replace with `<SlotInfo nameClass={...}
      displayName={...} isLoaded={...} isBankLoading={...} testId={...} />`.

  - id: ac-radio-tabs-inline
    added_in: 1fa334f5
    primitive: AcRadioTabs
    # Promoted to editor-core in akai-harmonization Phase 2 task 2.2
    # (2026-05-24). `canonical_implementation_file:` names the post-
    # promotion path so the scanner auto-excludes it (the file's body
    # IS the legacy shape, by construction).
    #
    # Updated 2026-05-24 per AUDIT-20260524-10 (closed): the class
    # namespace renamed from `.ac-tabs` / `.ac-tab-strip` / `.ac-panels`
    # to `.ac-radio-tabs` / `.ac-radio-tab-strip` / `.ac-radio-panels`
    # (to disambiguate from the bare `.ac-tabs` button-tab chrome
    # consumed by LibraryPanel + BuildInfo). The shape_regex patterns
    # below match BOTH the pre-rename and the post-rename inline
    # clones — that way a copy-paste of the canonical component (which
    # would emit `ac-radio-tabs`) is caught AND a copy-paste of any
    # legacy adopter that still has the old class names (none should,
    # but defense in depth) is also caught.
    from: '@audiocontrol/editor-core'
    canonical_implementation_file: 'modules/editor-core/src/components/AcRadioTabs.tsx'
    shape_regex:
      - '<div className="ac-radio-tabs" role="radiogroup"'
      - '<div className="ac-radio-tab-strip">'
      - '<div className="ac-radio-panels">'
    min_distance: 30
    message: |
      Inline radio-driven tab strip was promoted to the AcRadioTabs component
      in commit 1fa334f5 (and to @audiocontrol/editor-core in akai-
      harmonization Phase 2 task 2.2 on 2026-05-24). Replace with
      `<AcRadioTabs tabs={...} panels={...} defaultTabId={...}
      groupName={...} ariaLabel={...} />`. For sibling-dependent tab strips,
      use controlled mode: pass `activeId` + `onActiveIdChange`.

  - id: destination-eyebrow-inline
    added_in: 81da20a9
    primitive: DestinationEyebrow
    from: '@/components/library/DestinationEyebrow'
    shape_regex:
      - 'data-testid="destination-eyebrow-kind"'
      - 'data-testid="destination-eyebrow-library"'
      - 'data-testid="destination-eyebrow-device"'
    min_distance: 10
    excludes_paths:
      - 'modules/roland-sxx0-editor/src/components/library/DestinationEyebrow.tsx'
    message: |
      Inline 3-span destination eyebrow row was promoted to the
      DestinationEyebrow component in commit 81da20a9. Replace with
      `<DestinationEyebrow kindLabel={...} deviceName={...} itemCount={...} />`.

  - id: library-device-memory-panel-inline
    added_in: dedd4d2f
    primitive: LibraryDeviceMemoryPanel
    from: '@/plugins/shared/LibraryDeviceMemoryPanel'
    shape_regex:
      - '<DeviceMemoryPanel'
      - 'tones=\{state\.tones\}'
      - 'patches=\{state\.patches\}'
      - 'onSelectTone=\{state\.onSelectTone\}'
    min_distance: 20
    excludes_paths:
      - 'modules/roland-sxx0-editor/src/plugins/shared/LibraryDeviceMemoryPanel.tsx'
    message: |
      Inline DeviceMemoryPanel props-pass-through was promoted to the
      LibraryDeviceMemoryPanel adapter in commit dedd4d2f. Replace with
      `<LibraryDeviceMemoryPanel state={state} />`.

  # akai-harmonization Phase 2 task 2.2 (2026-05-24) — the three S3K
  # parallel control-primitive families promoted to canonical chrome.
  # Paired adversarial scenarios live in
  # tools/scope-discovery/anti-patterns.s3k-param-shape-scenarios.ts
  # (positive + negative + gutted-stub). The ParamKnob.tsx legacy
  # component file was deleted in the same commit, so no excludes_paths
  # is needed — the canonical primitives live in editor-core, not akai.
  - id: s3k-param-input-inline
    added_in: '74505449'
    primitive: AcNumberInput
    from: '@audiocontrol/editor-core'
    shape_regex: '\bs3k-param-input\b'
    excludes_paths:
      # The paired scenarios file plants the legacy shape as a fixture
      # to assert the scanner catches it; excluding the scenarios file
      # is the canonical excludes_paths secondary use case (per the
      # YAML schema header docs).
      - 'tools/scope-discovery/anti-patterns.s3k-param-shape-scenarios.ts'
    message: |
      Legacy s3k-param-input chrome (akai dialect's
      pre-harmonization editable parameter readout) was promoted to
      the canonical AcNumberInput (editable shape). Replace with
      `<AcNumberInput editable value={...} onChange={...} min={...}
      max={...} />` imported from `@audiocontrol/editor-core`, OR use
      the akai dialect wrapper `<S3kParamRow>` which composes
      AcSlider + AcNumberInput.

  - id: s3k-param-select-inline
    added_in: '74505449'
    primitive: ac-select (native HTML select styled by .ac-select)
    from: '@audiocontrol/editor-core'
    shape_regex: '\bs3k-param-select\b'
    excludes_paths:
      - 'tools/scope-discovery/anti-patterns.s3k-param-shape-scenarios.ts'
    message: |
      Legacy s3k-param-select chrome (akai dialect's
      pre-harmonization enum-picker) was promoted to the canonical
      `<select className="ac-select">` pattern wrapped in
      `<div className="ac-compact-field">` with an
      `<span className="ac-field-label">` eyebrow. Replace with the
      `<S3kParamSelectRow>` akai dialect wrapper OR the raw
      compact-field shape (see roland's PatchCommonPanel.tsx for
      the canonical consumer).

  - id: s3k-param-toggle-inline
    added_in: '74505449'
    primitive: AcToggle
    from: '@audiocontrol/editor-core'
    # Matches the legacy class name in any JSX className form:
    #   - className="s3k-param-toggle"
    #   - className={`s3k-param-toggle ${...}`}
    #   - className={'s3k-param-toggle'}
    # The class name appears as a quoted string in every shape we care
    # about, surrounded by `=` / `{` / `"` / `'` / `` ` ``.
    shape_regex: '\bs3k-param-toggle\b'
    excludes_paths:
      - 'tools/scope-discovery/anti-patterns.s3k-param-shape-scenarios.ts'
    message: |
      Legacy s3k-param-toggle chrome (akai dialect's
      pre-harmonization ON/OFF button) was promoted to AcToggle
      configured as a two-position segmented control. Replace with
      `<S3kParamToggleRow label={...} checked={...} onChange={...} />`
      from `@/components/ui/S3kParamToggleRow` OR construct AcToggle
      directly. The regex matches the bare class name anywhere it
      appears (className=, template literals, modifiers).

  - id: download-blob-inline
    added_in: ae0b5192
    primitive: downloadBlob
    from: '@audiocontrol/editor-core'
    shape_regex:
      - 'URL\.createObjectURL\('
      - 'document\.createElement\(.a.\)'
      - 'URL\.revokeObjectURL\('
    min_distance: 10
    excludes_paths:
      - 'modules/editor-core/src/utils/browser-download.ts'
      # akai SampleTransferPanel migrated via RGM-001 sub-task 4
      # (promoted downloadBlob to @audiocontrol/editor-core; akai +
      # roland-sxx0-editor both import from there now).
    message: |
      Inline createObjectURL + anchor click + revoke sequence was promoted to
      the downloadBlob utility (originally added in commit ae0b5192 in
      roland-sxx0-editor; promoted to @audiocontrol/editor-core
      2026-05-23 per RGM-001 sub-task 4). Replace with
      `import { downloadBlob } from '@audiocontrol/editor-core'` +
      `downloadBlob(blob, filename)`.

  # akai-harmonization Phase 2 task 2.2 (2026-05-24) — harmonization-spec
  # § 6 items 1 + 5 closure. Two entries:
  #   - s3k-zone-tabs-inline: blocks re-introduction of the
  #     `.s3k-zone-tab*` family deleted in this commit (Commit 3 of the
  #     AcRadioTabs promotion sequence).
  #   - ac-page-sticky-header-inline: PREVENTIVE registration. The class
  #     family was removed in the PageTitleRow migration (commit bba5b13b);
  #     no akai file currently uses it, but Phase 1 inventory named the
  #     family as akai-specific drift that must not re-emerge.

  - id: s3k-zone-tabs-inline
    added_in: '0000aaaa'
    primitive: AcRadioTabs
    from: '@audiocontrol/editor-core'
    # Matches the class family deleted in this commit:
    # `s3k-zone-tabs` (container), `s3k-zone-tab` (button),
    # `s3k-zone-tab--active` (modifier), `s3k-zone-tab-sample` (inner span).
    shape_regex: '\bs3k-zone-tabs?\b'
    excludes_paths:
      - 'tools/scope-discovery/anti-patterns.s3k-zone-tabs-scenarios.ts'
    message: |
      `.s3k-zone-tab*` was a parallel primitive for tab-selector chrome
      (harmonization-spec.md § 6 item 5). The canonical replacement is
      AcRadioTabs from @audiocontrol/editor-core (use controlled mode
      when a sibling component depends on the active tab id — pass
      activeId + onActiveIdChange). Re-registering the class family
      would re-introduce the migration debt this commit closed
      (akai-harmonization Phase 2 task 2.2, Commit 3 of the AcRadioTabs
      promotion sequence).

  # akai-harmonization Phase 2 task 2.2 (2026-05-24) — AcZoneStrip
  # primitive extraction. Prevents re-introduction of inline
  # .ac-zone-segment* / .ac-zone-handle* class usage outside the
  # canonical AcZoneStrip + zone-strip-primitives.css source-of-truth.
  # The classes are internal to the primitive; consumers should
  # import <AcZoneStrip> instead of touching the class names directly.

  - id: inline-zone-segment-bar
    added_in: '0000bbbb'
    primitive: AcZoneStrip
    from: '@audiocontrol/editor-core'
    # Matches the canonical zone-strip class family that lives ONLY
    # in editor-core/src/design/zone-strip-primitives.css:
    #   .ac-zone-segment, .ac-zone-segment--off, .ac-zone-segment--editing,
    #   .ac-zone-segment--dragging, .ac-zone-segment-body,
    #   .ac-zone-handle, .ac-zone-handle--start, .ac-zone-handle--end,
    #   .ac-zone-handle--split, .ac-zone-handle--dragging
    # The regex catches the bare class identifiers in any JSX className
    # form (className="...", template-literal, modifier suffix). It is
    # narrower than `\bac-zone-` to avoid false-positiving on the
    # sibling .ac-zone-bar / .ac-zone-bar-empty / .ac-zone-section* /
    # .ac-zone-axis / .ac-zone-form* / .ac-keygroup-zone-rect classes
    # — those are either the primitive's outer container (legitimately
    # used by AcZoneStrip itself) or roland's per-page chrome around
    # the primitive (legitimate to retain).
    shape_regex: '\bac-zone-(segment(-body|--off|--editing|--dragging)?|handle(--start|--end|--split|--dragging)?)\b'
    canonical_implementation_file: 'modules/editor-core/src/components/AcZoneStrip.tsx'
    excludes_paths:
      # Scope-discovery validator scenarios that plant the legacy
      # shape as a fixture (canonical excludes_paths secondary use
      # case per the YAML schema header docs).
      - 'tools/scope-discovery/anti-patterns.inline-zone-segment-bar-scenarios.ts'
      # The CSS source-of-truth file declares the class names; the
      # canonical_implementation_file: auto-exclude catches the .tsx
      # but the regex would also flag the CSS rule selectors.
      - 'modules/editor-core/src/design/zone-strip-primitives.css'
      # Test files that legitimately query the canonical primitive's
      # internal class names via container.querySelector to assert
      # AcZoneStrip behavior (the primitive's own tests + per-
      # consumer integration tests that need to drill into the
      # rendered class tree). The classes are AcZoneStrip-internal
      # surfaces; the tests don't re-introduce inline usage, they
      # observe the primitive's emitted shape.
      - 'modules/akai-s3k-editor/test/unit/components/keygroups/KeyRangeEditor.test.tsx'
      - 'modules/akai-s3k-editor/test/unit/components/keygroups/VelocityRangeBar.test.tsx'
      - 'modules/editor-core/src/components/AcZoneStrip.test.tsx'
    message: |
      Inline .ac-zone-segment* or .ac-zone-handle* class usage is an
      anti-pattern. The classes are internal to the canonical
      AcZoneStrip primitive (introduced commit 03f36ce3 during
      akai-harmonization Phase 2 task 2.2). Consumers should import
      the React component:
        import { AcZoneStrip } from '@audiocontrol/editor-core';
        <AcZoneStrip zones={...} range={...} ... />
      Re-introducing the inline shape would split the canonical
      source-of-truth and re-create the dialect-leak this commit
      sequence closed.

  # akai-harmonization Phase 2 task 2.2 (2026-05-24) — AcEnvelope kind
  # 'adsr' variant + AcFrequencyResponse extraction dispatch. Prevents
  # re-introduction of the .s3k-envelope-display / .s3k-adsr-* SVG-
  # direct envelope chrome that the dispatch deleted. The classes were
  # a parallel primitive for envelope + filter-response visualization;
  # the canonical replacements are <AcEnvelope> (kind='multi-segment'
  # or kind='adsr') and <AcFrequencyResponse>, both from
  # @audiocontrol/editor-core.

  - id: s3k-envelope-display-inline
    added_in: '0000cccc'
    primitive: AcEnvelope
    from: '@audiocontrol/editor-core'
    # Matches both the s3k-envelope-display class AND the s3k-adsr-*
    # SVG chrome subclasses that were part of the deleted family.
    # Regex anchors on \b token boundaries; sibling classes like
    # `s3k-envelope-section` or `s3k-section-title` do NOT match
    # (their identifiers don't start with the `s3k-envelope-display`
    # or `s3k-adsr-` tokens). Suffixed variants like `s3k-envelope-
    # display-history` DO match (intentionally — re-introducing the
    # family under a longer name is still the legacy chrome). Per
    # TF-015 the paired scenarios file (anti-patterns.s3k-envelope-
    # display-scenarios.ts) covers both the over-match guard
    # (sibling-class negative) and the suffix positive case.
    shape_regex: '\bs3k-(envelope-display|adsr-(bg|fill|line|dot|hit|label))\b'
    excludes_paths:
      # Scenario fixture (registry strings here would otherwise self-match).
      - 'tools/scope-discovery/anti-patterns.s3k-envelope-display-scenarios.ts'
      # Documentation comments in the canonical primitives that
      # reference the legacy class name as MIGRATION HISTORY (not
      # chrome usage). Keeping these readable preserves future-
      # archeology context.
      - 'modules/editor-core/src/components/AcEnvelopeAdsr.tsx'
      - 'modules/editor-core/src/components/AcFrequencyResponse.tsx'
      - 'modules/editor-core/src/design/frequency-response-primitives.css'
    message: |
      `.s3k-envelope-display` / `.s3k-adsr-*` was a parallel primitive
      family for SVG-direct envelope + filter-response chrome
      (harmonization-spec.md § 6 item 6). The canonical replacements
      are:
        - <AcEnvelope kind="multi-segment"> for uniform N-segment
          envelopes (roland tones, akai filter envelope)
        - <AcEnvelope kind="adsr"> for classic 4-parameter ADSR
          envelopes (akai amp envelope)
        - <AcFrequencyResponse> for filter frequency-response curves
          (akai filter cutoff + Q)
      All three live in @audiocontrol/editor-core. Re-registering the
      class family would re-introduce the migration debt this commit
      sequence closed (akai-harmonization Phase 2 task 2.2 Commits 1-6).

  # akai-harmonization Phase 2 task 2.5 (2026-05-25) — harmonization-spec
  # § 6 item 3 closure. Catches `text-blue-* hover:underline` tailwind
  # link chrome on <a> or <button> elements; the canonical replacement
  # is `<a className="ac-link">` or `<button className="ac-link">`
  # (the .ac-link primitive is button-or-anchor-agnostic). Paired
  # adversarial scenarios live in
  # tools/scope-discovery/anti-patterns.tailwind-link-chrome-scenarios.ts
  # (positive anchor + positive button + negative canonical + TF-015
  # sibling-class negative for informational <span text-blue-*> +
  # gutted-stub self-check).
  #
  # Multi-pattern fingerprint with min_distance: 5 — JSX
  # `onClick={() => ...}` arrows contain `>` characters that defeat a
  # single-regex `<(a|button)[^>]*` match (the regex stops at `=>`).
  # The two-pattern approach co-locates `<(a|button)` with the
  # `text-blue/cyan + hover:underline` className shape within 5 source
  # lines, which disambiguates "link chrome on a link element" from
  # "non-link informational blue text" (the akai codebase has spans +
  # divs carrying `text-blue-200` / `text-blue-400` for selection
  # tinting + drop-target callouts that must NOT flag).
  # akai-harmonization Phase 2 task 2.5 (2026-05-25) — harmonization-spec
  # § 6 item 2 closure. Catches inline tailwind chrome on <button>
  # elements (bg-(gray|blue|amber|red)-N + (px-N|py-N|rounded)); the
  # canonical replacement is the .ac-btn family (.ac-btn, .ac-btn-sm,
  # .ac-btn-primary, .ac-btn-secondary, .ac-btn-danger, .ac-btn-success)
  # from @audiocontrol/editor-core's primitives.css. Paired adversarial
  # scenarios live in
  # tools/scope-discovery/anti-patterns.tailwind-button-chrome-scenarios.ts
  # (positive basic + positive primary + positive rounded-first
  # ordering + negative canonical + TF-015 sibling-class negatives:
  # parent-div-with-chrome-wrapping-minimal-button + layout-utilities-
  # on-ac-btn + non-button-elements + gutted-stub self-check).
  #
  # Single-regex anchored on `<button\b` + bounded lazy gap of
  # [^<]{0,400} chars + className attribute carrying bg-color AND
  # (px-N|py-N|rounded) tokens in EITHER order. The `[^<]` constraint
  # in the gap prevents the regex from crossing element boundaries
  # (a `<` character ends the `<button>` opening tag's region), which
  # is critical for avoiding false positives on adjacent sibling
  # elements carrying tailwind chrome (e.g., the DrumKitEditorDialog
  # error <div bg-red-900 rounded> sitting near the migrated <button
  # className="ac-btn ac-btn-primary"> — pre-fix the regex matched
  # the sibling div's className across 18 lines). The bg+px
  # alternation handles both `bg-X px-Y rounded` and
  # `px-Y rounded bg-X` orderings present in the pre-migration
  # codebase. This shape is preferable to a multi-pattern fingerprint
  # because the latter would false-positive when a parent
  # `<div bg-X rounded>` wraps a `<button>` with minimal styling
  # (e.g., DiskBrowserPanel.tsx:312 dismiss-error button +
  # KeygroupSummary.tsx:69 +Add button); the anchored single-regex
  # form correctly skips those.
  #
  # `excludes_paths:` documents the out-of-scope sub-shapes the
  # operator deferred for this dispatch (per task 2.5 NEEDS DECISION
  # answers):
  #   - ZoneOverviewToolbar.tsx: 4 zoom mini-buttons; no canonical
  #     mini-button primitive exists yet
  #     (#cross-editor-akai-mini-btn-primitive).
  #   - DiskBrowserPanel.tsx + DeviceMemoryPanel.tsx: tree-disclosure
  #     + selection-row list-button chrome; substantial separate work
  #     to adopt a canonical selection-row primitive
  #     (#cross-editor-akai-disk-tree-adoption).
  #   - PluginLibraryBrowser.tsx (editor-core) + TriggerMethodContent.tsx
  #     (sample-chopper): cross-editor holdouts surfaced by the repo-
  #     wide scan. These live outside the akai-harmonization Phase 2
  #     scope and should be migrated in a follow-up that touches their
  #     respective modules (#cross-editor-tailwind-button-chrome-holdouts).
  - id: tailwind-button-chrome-inline
    added_in: '0000ffff'
    primitive: ac-btn
    from: '@audiocontrol/editor-core'
    shape_regex: '<button\b[^<]{0,400}?className=["''`](?:[^"''`]*\bbg-(?:gray|blue|amber|red)-\d+\b[^"''`]*\b(?:px-\d+|py-\d+|rounded)\b|[^"''`]*\b(?:px-\d+|py-\d+|rounded)\b[^"''`]*\bbg-(?:gray|blue|amber|red)-\d+\b)'
    excludes_paths:
      - 'tools/scope-discovery/anti-patterns.tailwind-button-chrome-scenarios.ts'
      # Sub-shape C — out-of-scope for task 2.5
      # (#cross-editor-akai-mini-btn-primitive). 4 zoom mini-buttons
      # awaiting a canonical .ac-mini-btn / .ac-icon-btn-sm primitive.
      - 'modules/akai-s3k-editor/src/components/keygroups/ZoneOverviewToolbar.tsx'
      # Sub-shape D — out-of-scope for task 2.5
      # (#cross-editor-akai-disk-tree-adoption). Tree disclosure +
      # selection-row chrome awaiting a canonical TreeView /
      # selection-row primitive adoption.
      - 'modules/akai-s3k-editor/src/components/library/DiskBrowserPanel.tsx'
      - 'modules/akai-s3k-editor/src/components/library/DeviceMemoryPanel.tsx'
      # Cross-editor holdouts — same anti-pattern shape exists in
      # editor-core + sample-chopper. Out-of-scope for the akai-
      # harmonization dispatch; tracked as
      # #cross-editor-tailwind-button-chrome-holdouts for a follow-up
      # that touches those modules.
      - 'modules/editor-core/src/components/library/PluginLibraryBrowser.tsx'
      - 'modules/sample-chopper/src/ui/components/TriggerMethodContent.tsx'
    message: |
      Tailwind utility chrome on `<button>` elements is an anti-pattern
      (harmonization-spec.md § 6 item 2). The canonical replacement is
      `<button className="ac-btn">` (or `.ac-btn-sm` for compact /
      `.ac-btn-primary` for primary / `.ac-btn-danger` for destructive
      variants) from `@audiocontrol/editor-core`'s `primitives.css`.
      The .ac-btn vocabulary uses Departure-Mono uppercase + eyebrow
      tracking matching the v3 design language. Re-registering would
      re-introduce the design-system bypass this akai-harmonization
      Phase 2 task 2.5 commit closed.

