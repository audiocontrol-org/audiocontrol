          props-pass-through wiring + the empty-state / loading-state
          branching; adopting it drops the akai-side adapter to a
          one-line `<LibraryDeviceMemoryPanel state={state} />` render
          and deduplicates the per-editor wrapper.

          WHY: the canonical adapter's `state:
          DeviceMemoryCustomState` contract was designed against
          roland's per-bank library shape (8 patches per bank × 16
          banks, with bank metadata + patch slots). Akai's
          `S3kMemoryPanelState` is a flat-list shape (128 programs +
          128 samples + 250 keygroups, no banks) carrying
          akai-specific metadata (program-vs-keygroup-vs-sample
          discriminator, drum-kit assignment). The two state shapes
          can't be unified without one of:
            (a) the canonical adapter accepting a discriminated-union
                `state: DeviceMemoryCustomState | S3kMemoryPanelState`
                with per-variant rendering — widens the canonical
                adapter's surface;
            (b) `S3kMemoryPanelState` reshaping into a
                `DeviceMemoryCustomState`-compatible structure with
                vestigial banks — distorts akai's natural data model;
            (c) extracting a state-shape interface that both states
                implement, behind a generic `LibraryDeviceMemoryPanel<S
                extends LibraryPanelState>` — cleanest but largest
                refactor.

          UNLOCKS WHEN: the operator picks one of (a) / (b) / (c) as
          the cross-editor harmonization direction. The decision crosses
          the editor-core/akai-s3k-editor module boundary so it's an
          architectural-direction call rather than a tactical
          adopter-side fix. Phase 3+ scope.
    message: |
      Per-device library plugins should render DeviceMemoryPanel via
      the shared LibraryDeviceMemoryPanel adapter (introduced in commit
      dedd4d2f). Replace inline `<DeviceMemoryPanel ...props-pass-through... />`
      with `<LibraryDeviceMemoryPanel state={state} />`.

  - id: library-preview-panel-adapter
    introduced_in: dedd4d2f
    from: '@/plugins/shared/LibraryPreviewPanelAdapter'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/plugins/s330-library-plugin.tsx'
      - 'modules/roland-sxx0-editor/src/plugins/s550-library-plugin.tsx'
      # akai s3kLibraryPlugin — added 2026-05-25 (Phase 2 task 2.3
      # cross-editor backfill). Same situation as
      # library-device-memory-panel-adapter: akai has a hand-rolled
      # S3kPreviewPanelAdapter routing to S3kItemPreviewPanel; migration
      # to canonical adapter pending preview-state contract harmonization.
      - 'modules/akai-s3k-editor/src/plugins/s3k-library-plugin.tsx'
    tracked_holdouts:
      - path: 'modules/akai-s3k-editor/src/plugins/s3k-library-plugin.tsx'
        reason: |
          WHAT: migrate akai's hand-rolled `S3kPreviewPanelAdapter`
          (routes selection events to `S3kItemPreviewPanel` and
          renders the akai-specific preview chrome) to the canonical
          `LibraryPreviewPanelAdapter` from
          `@/plugins/shared/LibraryPreviewPanelAdapter` (introduced
          commit dedd4d2f; consumed by both roland s330 + s550 library
          plugins). The canonical adapter owns the preview-routing
          function-body + the selection-to-preview-state mapping;
          adoption drops the akai-side wrapper and deduplicates the
          per-editor preview-panel wiring.

          WHY: shares the same root cause as the
          library-device-memory-panel-adapter holdout above — the
          canonical adapter's `context: PreviewPanelCustomState`
          contract was designed against roland's preview shape
          (patch/tone/sample preview metadata with bank-relative
          slot identifiers), while akai's `S3kPreviewCustomState`
          carries program/keygroup/sample preview metadata with
          flat-list slot identifiers + akai-specific drum-kit
          attribution. Same three resolution paths apply: union the
          state shapes, reshape akai to match roland, or extract a
          state-shape interface.

          UNLOCKS WHEN: bundled into the same cross-editor library-
          plugin state harmonization pass as the device-memory-panel
          adapter migration above. The two adapters share the same
          state-contract decision (a / b / c) and should land
          together so the akai library plugin ends up consuming both
          canonical adapters uniformly rather than half-migrating.
    message: |
      Per-device library plugins should render the preview panel via
      the shared LibraryPreviewPanelAdapter (introduced in commit
      dedd4d2f). Replace inline preview-routing function body with
      `<LibraryPreviewPanelAdapter selection={selection} context={context} />`.

  # ────────────────────────────────────────────────────────────────────────
  # Upstream SlideDrawer primitive (editor-core). The 3 Roland Import
  # dialog deferrals were closed by ROLAND-BUGFIX-V3-IMPORT (#450) on
  # 2026-05-23 — all 6 active Roland library dialogs/drawers now adopt
  # SlideDrawer. The remaining 9 tracked_holdouts are all Akai library
  # dialogs (cross-editor deferral, out of scope for feature/roland-
  # bugfix). The 2 deleted ImportToneDialog + ImportSampleDialog were
  # dead-code orphans (never JSX-mounted); also removed by V3-IMPORT.
  # ────────────────────────────────────────────────────────────────────────

  # ────────────────────────────────────────────────────────────────────────
  # akai-harmonization Phase 2 task 2.2 (2026-05-24). The canonical
  # control-primitive triad (AcSlider, AcNumberInput, AcToggle) is now
  # consumed via per-editor wrappers that compose them into the same
  # parameter-row shape but layer dialect-specific affordances on top
  # (akai: integer-round + select-all-on-focus; roland: required
  # tooltip + labelToTestId). The manifest enumerates the wrapper
  # files; the gate enforces that each wrapper actually imports the
  # canonical primitives (and didn't, e.g., reinvent the composition
  # locally).
  # ────────────────────────────────────────────────────────────────────────

  - id: ac-control-primitives-row
    introduced_in: '74505449'
    from: '@audiocontrol/editor-core'
    # Narrow the adoption check to the actual canonical primitive
    # imports — unrelated editor-core symbols in the wrapper file
    # (e.g., a hook import) MUST NOT satisfy the gate. Any one of
    # AcSlider / AcNumberInput / AcToggle counts as adoption since the
    # three are designed to compose; not every wrapper uses all three
    # (S3kParamSelectRow uses none of them — it uses raw <select> + CSS,
    # so it's intentionally NOT in this manifest's expected adopters).
    imports:
      - AcSlider
      - AcNumberInput
      - AcToggle
    expected_adopters_glob:
      # Akai dialect wrappers (S3kParamRow + S3kParamToggleRow).
      # S3kParamSelectRow is excluded — it uses native <select> + the
      # ac-select CSS class, not the React primitives.
      - 'modules/akai-s3k-editor/src/components/ui/S3kParamRow.tsx'
      - 'modules/akai-s3k-editor/src/components/ui/S3kParamToggleRow.tsx'
      # Roland dialect wrapper for the AcSlider + AcNumberInput
      # composition (the canonical-side pattern this manifest extends).
      - 'modules/roland-sxx0-editor/src/components/ui/ParamSliderRow.tsx'
    message: |
      Per-editor parameter-row wrappers (S3kParamRow, S3kParamToggleRow,
      ParamSliderRow) compose AcSlider + AcNumberInput + AcToggle from
      @audiocontrol/editor-core. If a new wrapper file lands without
      importing any of those symbols, it's reinventing the canonical
      composition — adopt the editor-core primitives instead. See
      modules/roland-sxx0-editor/src/components/ui/ParamSliderRow.tsx
      and modules/akai-s3k-editor/src/components/ui/S3kParamRow.tsx
      for the canonical compositions.

  # ────────────────────────────────────────────────────────────────────────
  # akai-harmonization Phase 2 task 2.2 (2026-05-24) — AcZoneStrip
  # primitive extraction. Promoted the .ac-zone-* family from roland's
  # patches.css to editor-core/src/design/zone-strip-primitives.css
  # alongside a new AcZoneStrip React component. Three adopters:
  #   - roland ToneZoneEditor (per-edge handle mode; original
  #     extraction surface)
  #   - akai VelocityRangeBar (splitHandles=true; 4-zone velocity bar
  #     with boundary handles between adjacent zones)
  #   - akai KeyRangeEditor (per-edge handle mode; single zone with
  #     low/high handles + handle a11y override for role="slider")
  # ────────────────────────────────────────────────────────────────────────

  - id: ac-zone-strip
    introduced_in: 03f36ce3
    from: '@audiocontrol/editor-core'
    imports:
      - AcZoneStrip
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/patches/ToneZoneEditor.tsx'
      - 'modules/akai-s3k-editor/src/components/keygroups/VelocityRangeBar.tsx'
      - 'modules/akai-s3k-editor/src/components/keygroups/KeyRangeEditor.tsx'
    message: |
      Segmented 1D zone bars (with per-segment drag handles) should
      use the shared AcZoneStrip primitive from
      @audiocontrol/editor-core (introduced commit 03f36ce3 during
      akai-harmonization Phase 2 task 2.2). Two interaction modes:
        - Per-edge handles (default): each zone has start/end drag
          handles (consumer receives `onStartDrag(zoneIndex, 'start'|
          'end', event)`). Used by ToneZoneEditor + KeyRangeEditor.
        - Split handles (splitHandles={true}): a boundary handle
          renders BETWEEN adjacent zones; consumer receives
          `onStartDrag(leftZoneIndex, 'split', event)`. Used by
          VelocityRangeBar.
      Per-zone hue is exposed via the `hue` field on each zone OR
      derives from the zone index via `defaultZoneHue` (matches
      roland's `.ac-zone-segment` pre-extraction palette). For
      interactive drag-edge handles, supply `startHandle` /
      `endHandle` HandleA11yOverride to promote the handle from
      role="separator" to role="slider".

  - id: slide-drawer-library-dialogs
    introduced_in: c41cf2a4
    from: '@audiocontrol/editor-core'
    # Cross-editor convention: every editor's library dialogs should use
    # the v3 SlideDrawer chrome from editor-core, not legacy Radix Dialog.
    # roland-sxx0-editor: 6 adopters (3 Export + 3 Import) + 0 tracked-
    #   holdouts — ROLAND-BUGFIX-V3-IMPORT (#450) closed 2026-05-23.
    # akai-s3k-editor: 9 adopters — 2 direct (DrumKitEditorDialog +
    #   LibraryToDiskDialog, migrated 2026-05-24 in Phase 2 task 2.2 of
    #   feature/akai-harmonization); 7 transitive (Send/Receive/Import/
    #   Export/Disk-to-Library dialogs that use SteppedProgressDrawer,
    #   which itself wraps SlideDrawer). Both count thanks to the
    #   `imports:` field below.
    imports:
      # SlideDrawer = direct adoption of the canonical primitive.
      # SteppedProgressDrawer = transitive adoption — it wraps SlideDrawer
      # internally (modules/editor-core/src/components/library/SteppedProgressDrawer.tsx
      # imports SlideDrawer and renders <SlideDrawer>…</SlideDrawer>).
      # Files importing either symbol count as adopters of the v3
      # drawer chrome.
      - SlideDrawer
      - SteppedProgressDrawer
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/library/ExportToneDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ExportPatchDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/BatchExportDrawer.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ImportLibraryToneDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ImportLibraryPatchDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ImportSamplesDialog.tsx'
      # NOTE: ImportSampleDialog.tsx + ImportToneDialog.tsx were dead-code
      # orphans (defined but never mounted by LibraryPage — the production
      # path uses useLibraryImportDialogs + ImportLibraryToneDialog). Deleted
      # as part of V3-IMPORT (#450); adopter-glob entries dropped here.
      - 'modules/akai-s3k-editor/src/components/library/DiskToLibraryDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/DrumKitEditorDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ExportProgramDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ImportDrumKitDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ImportInstrumentDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ImportProgramDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/LibraryToDiskDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ReceiveSampleDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/SendSampleDialog.tsx'
    # tracked_holdouts: (removed) The 7 SteppedProgressDrawer-using akai
    # dialogs that lived here through ROLAND-BUGFIX-V3-IMPORT (#450) are
    # now direct adopters thanks to the `imports:` field above, which
    # teaches the gate that SteppedProgressDrawer counts as transitive
    # adoption of SlideDrawer. Landed in Phase 2 task 2.2 of
    # feature/akai-harmonization (2026-05-24).
    message: |
      Library dialogs use the v3 SlideDrawer chrome from editor-core,
      not legacy Radix Dialog. Replace `<Dialog.Root>` + `<Dialog.Portal>`
      + `<Dialog.Overlay>` + `<Dialog.Content>` with `<SlideDrawer>`.
      SteppedProgressDrawer counts as transitive adoption (it wraps
      SlideDrawer internally). The `imports:` field above narrows the
      adoption check so unrelated editor-core symbols don't accidentally
      satisfy the gate.

  # akai-harmonization Phase 2 task 2.2 (2026-05-24) — AcEnvelope kind
  # 'adsr' variant landing. The canonical primitive grew a discriminated-
  # union `kind` prop in this dispatch's Commit 1:
  #   - kind='multi-segment' (default): existing uniform N-segment shape
  #   - kind='adsr' (new): classic 4-parameter ADSR with fixed 75/25 split
  # Two akai consumers (filter env multi-segment + amp env adsr) +
  # one roland consumer (tone env multi-segment) make up the
  # cross-editor adopter set.
  - id: ac-envelope
    introduced_in: d524da07
    from: '@audiocontrol/editor-core'
    imports:
      - AcEnvelope
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/ui/ToneEnvelopeEditor.tsx'
      - 'modules/akai-s3k-editor/src/components/keygroups/KeygroupEditor.tsx'
    message: |
      SVG-direct envelope chrome should use the shared AcEnvelope
      primitive from @audiocontrol/editor-core. The primitive carries
      a discriminated-union `kind` prop:
        - kind='multi-segment' (default): uniform N-segment envelope
          with `segments: { time, level }[]`. Used by roland tone
          envelopes (8 segments) and akai filter envelopes (4
          segments, maxTime/maxLevel=99).
        - kind='adsr': classic 4-parameter ADSR (attack time / decay
          time / sustain LEVEL held / release time) with fixed 75/25
          horizontal layout. Used by the akai amp envelope
          (maxValue=99 for the S3K parameter range).
      Per harmonization-spec.md § 5.2 / § 6 item 6, re-introducing
      inline .s3k-envelope-display / .s3k-adsr-* chrome is blocked by
      the paired s3k-envelope-display-inline anti-pattern.

  # akai-harmonization Phase 2 task 2.2 (2026-05-24) — AcFrequencyResponse
  # primitive extraction. Filter-response visualization (cutoff + Q on a
  # log-frequency × dB graph) was previously implemented inline in akai's
  # FilterDisplay.tsx; the canonical primitive ships in editor-core.
  - id: ac-frequency-response
    introduced_in: b83318d3
    from: '@audiocontrol/editor-core'
    imports:
      - AcFrequencyResponse
    expected_adopters_glob:
      - 'modules/akai-s3k-editor/src/components/keygroups/KeygroupEditor.tsx'
    message: |
      Filter frequency-response curves (cutoff + Q on a log-frequency
      × dB graph) should use the shared AcFrequencyResponse primitive
      from @audiocontrol/editor-core. Supports four classic filter
      topologies (lowpass / highpass / bandpass / notch) via the
      `filterType` prop. Frequency is in Hz (the natural physics
      domain); device-specific 0..99 parameter ranges should be
      converted at the call site via per-device adapter helpers (the
      akai consumer uses akaiFilterFreqToHz / akaiHzToFilterFreq).
      Per harmonization-spec.md § 5.2 / § 6 item 6, re-introducing
      inline .s3k-envelope-display chrome is blocked by the paired
      s3k-envelope-display-inline anti-pattern.

  # akai-harmonization Phase 2 task 2.2 (2026-05-24) — AcLiveStatusFooter
  # build-from-scratch primitive. No prior live-status footer chrome
  # existed in either editor; the spec's `adopt-roland-pattern`
  # disposition (harmonization-spec.md § 2.5) was forward-looking. The
  # canonical primitive ships in editor-core and both editors adopted
  # it atomically in this dispatch's commits 2 + 3.
  - id: ac-live-status-footer
    introduced_in: 1e6e40ad
    from: '@audiocontrol/editor-core'
    imports:
      - AcLiveStatusFooter
    expected_adopters_glob:
      - 'modules/akai-s3k-editor/src/pages/{Keygroups,Samples,Programs}Page.tsx'
      - 'modules/roland-sxx0-editor/src/pages/{Patches,Tones}Page.tsx'
    message: |
      Live-editing pages must surface the canonical AcLiveStatusFooter
      (introduced commit 1e6e40ad) below the detail column. The wiring
      pattern is documented in harmonization-spec.md § 2.5:
        1. Track lastEditAt via `const [lastEditAt, setLastEditAt] =
           useState<number | null>(null);`
        2. Call `setLastEditAt(Date.now())` inside every parameter-
           change handler AFTER the device-write promise resolves
           (errors leave the timestamp alone — the footer reports the
           LAST CONFIRMED edit).
        3. Mount `<AcLiveStatusFooter deviceLabel="..." lastEditAt={lastEditAt}
           state={isConnected ? 'live' : 'offline'} />` at the bottom of
           the .ac-page-shell--fixed-viewport, after the .ac-app-shell
           grid and before any dialog/drawer mounts.
      Per `feedback_rec_led_accent` (rec-LED is the device-active
      indicator, never danger) and `feedback_live_editing_no_save`
      (parameter edits stream live; replace save/cancel/undo with a
      live-status footer) operator memories.
