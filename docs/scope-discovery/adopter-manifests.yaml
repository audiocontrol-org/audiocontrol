# Adopter manifest registry — Phase 6 T6.2
#
# Pairs with `anti-patterns.yaml` (T6.1):
#   - anti-patterns find LEGACY shapes that should be REPLACED.
#   - adopter manifests find FILES that should be USING a canonical
#     primitive but aren't (regime-holdout / missing-adopter case).
#
# Each refactor commit that PROMOTES a primitive to a shared location
# (e.g., lifts `SlideDrawer` from one editor into `@/components/SlideDrawer`)
# SHOULD append an entry here naming the expected adopter set. The pre-
# commit gate (`make check-adopters`) walks the registry on every
# .ts/.tsx change and surfaces files matching the adopter glob but
# NOT importing the canonical `from` path. This closes the gap where
# the clone detector and the anti-pattern registry both miss the
# new-file-doesn't-adopt-the-extracted-primitive case.
#
# ──────────────────────────────────────────────────────────────────────────
# Schema
# ──────────────────────────────────────────────────────────────────────────
#
#   - id: <kebab-case-id; unique across the registry>
#     introduced_in: <commit-sha; 7-40 lowercase hex; the extraction commit>
#     from: <canonical import path STRING (back-compat) OR LIST OF paths>
#       # e.g., single:  from: '@/components/SlideDrawer'
#       # e.g., list:    from:
#       #                  - '@audiocontrol/editor-core'
#       #                  - '@/components/common/PageTitleRow'
#       # The list form supports cross-module primitive promotion
#       # (AUDIT-20260524-08): list both the post-promotion canonical
#       # path AND any pre-promotion module-local path so consumers
#       # importing via EITHER path count as adopters during the
#       # transition. The first list element is treated as the
#       # "primary" canonical (used for display in the gate's report);
#       # additional elements are transitional aliases.
#     expected_adopters_glob:
#       - <glob string; matched against repo-relative POSIX paths>
#       - <glob string>
#     exceptions:                  # optional; default empty
#       - path: <exact repo-relative path that matches one of the globs>
#         reason: |
#           <multi-line explanation for why this file legitimately
#            bypasses the primitive — e.g., "needs frame-rate scroll
#            lock that SlideDrawer doesn't expose">
#     tracked_holdouts:            # optional; default empty (AUDIT-06)
#       - path: <exact repo-relative path that matches one of the globs>
#         # AUDIT-20260525-20: `issue:` is OPTIONAL. When present, must
#         # be a URL or '#'-prefixed ref. When ABSENT, `reason:` must
#         # be SUBSTANTIVE (see Tracked-holdouts contract below).
#         issue: <URL or '#issue-ref', OR OMIT the field entirely>
#         reason: |
#           <multi-line explanation naming the deferral context — e.g.,
#            "pending ROLAND-BUGFIX-V3-IMPORT; v3 SlideDrawer migration
#            deferred">
#     message: |
#       <multi-line replacement instruction shown when a holdout is found>
#
# ──────────────────────────────────────────────────────────────────────────
# Glob syntax (see tools/scope-discovery/util/glob.ts for the compiler)
# ──────────────────────────────────────────────────────────────────────────
#
#   - `**`        — any number of path segments (including zero)
#   - `*`         — any run of non-`/` characters within a segment
#   - `?`         — any single non-`/` character
#   - `{a,b,c}`   — alternation; non-nested; commas separate alternatives
#   - literal `/` — path separator (always forward-slash)
#
# Patterns are anchored against the full repo-relative path. Repo-relative
# paths are computed from the gate's `--root` flag (default: cwd).
#
# Exceptions: each exception `path` must match at least one of the
# manifest's `expected_adopters_glob` patterns. Exceptions whose path
# wouldn't be considered by the holdout calculation are rejected at
# parse time (they would be inert; the diagnostic is mechanical).
#
# Tracked holdouts (AUDIT-20260522-06): `tracked_holdouts:` is a
# distinct disposition from `exceptions:`. Tracked holdouts are files
# the operator KNOWS need to migrate but has explicitly deferred. The
# gate exits 0 when only tracked-holdouts remain (no real holdouts);
# they appear under their own report section + the editor-symmetry
# matrix renders them as `⏳ A/E (T tracked)` instead of being masked
# as `✓`. Each entry MUST carry:
#   - `path:` (matches at least one glob, just like exceptions)
#   - `reason:` (multi-line explanation naming the deferral context)
# Each entry MUST carry follow-up signal under one of two shapes (AUDIT-
# 20260525-20):
#   - `issue:` URL (containing `://`) OR `#`-prefixed GitHub-style ref —
#     a navigable tracker artifact. Any `reason:` shape accepted when
#     `issue:` is present.
#   - `issue:` ABSENT — then `reason:` must be SUBSTANTIVE: >= 80 chars
#     after trim AND not a placeholder/anti-gaming phrase ("TODO",
#     "deferred", "see issue", "tracking pending", "fix later", etc.).
#     The substantive-reason check rejects symbolic placeholders that
#     satisfy the parser but defeat the registry's tracking-discipline
#     contract (the field's purpose is to prevent the registry from
#     becoming a "fix-it-later" dumping ground; placeholder refs
#     looked-like-issues without being navigable, which is the same
#     failure mode).
# Entries with NEITHER a well-formed `issue:` NOR a substantive `reason:`
# are rejected at parse time. A path cannot appear in BOTH `exceptions:`
# and `tracked_holdouts:` for the same entry — these dispositions are
# mutually exclusive.
#
# Import detection: the gate matches `import ... from '<from>'`,
# `import('<from>')`, `export ... from '<from>'`, and
# `require('<from>')`. Both single- and double-quoted strings are
# accepted. Each `<from>` value is escaped before insertion into the
# match regex, so meta characters in the canonical path (`/`, `.`, `@`)
# are matched literally. When `from:` is a list, the detection regex
# OR-combines every listed path inside the quoted-string position; a
# consumer file containing an import of ANY listed path counts as an
# adopter (AUDIT-08).
#
# Engine choice (documented inline for future agents):
#   Glob-to-regex over `fast-glob` / `picomatch` / `globby`. None of
#   those packages are a direct dependency of this repo (they appear
#   only transitively); adding one for the narrow shapes adopter
#   manifests actually use widens the dep surface for marginal benefit.
#   The shape grammar (above) is small and finite; a 100-line compiler
#   beats a 2MB dep. Mirrors T6.1's pure-regex stance.
#
# Pre-commit hook (`make check-adopters`) walks this registry on every
# .ts/.tsx change and flags any holdouts. See
# `tools/scope-discovery/check-adopters.ts` for the gate.

adopter_manifests:
  # ────────────────────────────────────────────────────────────────────────
  # Backfilled 2026-05-22 from feature/roland-bugfix Phase 5. Covers the
  # 9 primitives extracted during Phase 2 plus the upstream SlideDrawer
  # primitive. The 3 Roland Import-dialog deferrals were closed by
  # ROLAND-BUGFIX-V3-IMPORT (#450) on 2026-05-23; the remaining 9
  # SlideDrawer tracked_holdouts are all Akai cross-editor deferrals.
  #
  # Notes for the reader:
  # - The narrow-scope component primitives (BankHeader, SlotInfo,
  #   AcRadioTabs, DestinationEyebrow, LibraryDeviceMemoryPanel,
  #   LibraryPreviewPanelAdapter, AcReloadIcon) use literal-path globs
  #   to enumerate the current adopter set. Future expansions of the
  #   adopter set are operator-edits to the glob; the manifest then
  #   surfaces holdouts at the new locations.
  # - SlideDrawer's Roland adopters are now complete (6 of 6 active
  #   library dialogs/drawers); the only remaining tracked_holdouts
  #   are 9 Akai library dialogs that never adopted v3 chrome (out of
  #   scope for feature/roland-bugfix).
  # ────────────────────────────────────────────────────────────────────────

  - id: page-title-row
    introduced_in: b996aa01
    # Promoted to editor-core in akai-harmonization Phase 2 task 2.2 —
    # canonical import path moved from roland-local '@/components/common/'
    # to '@audiocontrol/editor-core' so cross-editor consumers (akai
    # now, jv1080 / d110 later) can adopt the same primitive without
    # per-module forking.
    from: '@audiocontrol/editor-core'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/pages/PatchesPage.tsx'
      - 'modules/roland-sxx0-editor/src/pages/TonesPage.tsx'
      - 'modules/roland-sxx0-editor/src/pages/PlayPage.tsx'
      - 'modules/roland-sxx0-editor/src/pages/HomePage.tsx'
      - 'modules/roland-sxx0-editor/src/pages/LibraryPage.tsx'
      - 'modules/akai-s3k-editor/src/pages/ProgramsPage.tsx'
      - 'modules/akai-s3k-editor/src/pages/KeygroupsPage.tsx'
      - 'modules/akai-s3k-editor/src/pages/SamplesPage.tsx'
      - 'modules/akai-s3k-editor/src/pages/LibraryPage.tsx'
    message: |
      Editor pages with a title row + LED metric + refresh affordance
      should render via the shared PageTitleRow primitive (introduced
      in commit b996aa01, promoted to editor-core in akai-harmonization
      Phase 2 task 2.2). Replace inline `<header className="ac-page-title-row">`
      markup with `<PageTitleRow headingId="..." headingText="..."
      metric={...} loadingMessage={...} isLoading={...} onRefresh={...}
      refreshLabel="..." />` imported from `@audiocontrol/editor-core`.

  - id: use-export-dialog-lifecycle
    introduced_in: dce8fc72
    from: '@/hooks/useExportDialogLifecycle'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/library/ExportToneDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ExportPatchDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/BatchExportDrawer.tsx'
      # akai export/transfer dialogs — added 2026-05-25 (Phase 2 task
      # 2.3 cross-editor backfill). All 4 use SteppedProgressDrawer
      # with inline lifecycle state (setIsComplete/setHasError/setSteps
      # +cancelledRef); should adopt the canonical hook to deduplicate.
      # Cross-editor harmonization pending state-contract alignment —
      # tracked below.
      - 'modules/akai-s3k-editor/src/components/library/ExportProgramDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/SendSampleDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ReceiveSampleDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/DiskToLibraryDialog.tsx'
    tracked_holdouts:
      - path: 'modules/akai-s3k-editor/src/components/library/ExportProgramDialog.tsx'
        reason: |
          WHAT: migrate this dialog from inline lifecycle state
          (`useState<boolean>(false)` for isComplete + hasError,
          `useState<StepState[]>` for steps, a `useRef<boolean>` for
          cancellation) to the canonical `useExportDialogLifecycle`
          hook from `@/hooks/useExportDialogLifecycle` (introduced
          commit dce8fc72; consumed by all 3 roland export dialogs).
          The hook owns `localError`, `hasStarted`, `isComplete`,
          `effectiveError`, `steps`, and `handleClose`, deduplicating
          ~40 lines of identical lifecycle wiring per dialog.

          WHY: akai's SteppedProgressDrawer consumers shipped before
          the canonical hook landed in roland's bugfix branch
          (ROLAND-BUGFIX-V3-IMPORT, 2026-05-23). The state shape
          differs slightly: the hook's `progress` + `operationError`
          inputs assume a controller-supplied progress object, whereas
          akai's dialogs derive progress from their own async-iterator
          state machine (`useDeviceTransfer` / `useDiskOperation`).
          Naively adopting the hook would either drop akai's progress
          semantics or force a state-contract harmonization across
          both editors.

          UNLOCKS WHEN: either (a) the canonical hook grows a
          discriminated-union progress contract that accepts both
          roland's progress-object shape and akai's iterator-derived
          shape, OR (b) akai's transfer hooks adopt the
          progress-object shape (a follow-up that touches every
          SteppedProgressDrawer call-site). Operator decides which
          direction to take; both are larger than Phase 2 task 2.3's
          adopter-manifest backfill scope, so the work was deferred.
      - path: 'modules/akai-s3k-editor/src/components/library/SendSampleDialog.tsx'
        reason: |
          WHAT: same migration as ExportProgramDialog above — adopt
          `useExportDialogLifecycle` for the standard `localError` +
          `hasStarted` + `isComplete` + `effectiveError` + `steps` +
          `handleClose` derivation. SendSampleDialog wraps
          SteppedProgressDrawer for the
          DeviceMemory→Disk-Sample-Slot send operation.

          WHY: shares the same blocker as ExportProgramDialog — the
          dialog drives a progress source (`useSendSample` from
          `@/state/use-send-sample`) whose progress object doesn't
          match the canonical hook's expected shape. Inline lifecycle
          state was used to keep the dialog compatible with akai's
          progress contract while v3 chrome (SteppedProgressDrawer)
          was being adopted in Phase 2 task 2.2.

          UNLOCKS WHEN: the state-contract harmonization across all 4
          akai SteppedProgressDrawer consumers lands as a single
          follow-up effort. Splitting per-dialog would create
          temporary inconsistency (some adopt the hook, some don't)
          that the gate would mask as partial-adoption noise.
      - path: 'modules/akai-s3k-editor/src/components/library/ReceiveSampleDialog.tsx'
        reason: |
          WHAT: same migration as the two above — adopt the canonical
          `useExportDialogLifecycle` hook. ReceiveSampleDialog wraps
          SteppedProgressDrawer for the
          Disk-Sample-Slot→DeviceMemory receive operation.

          WHY: same root cause — the `useReceiveSample` hook drives a
          progress source that doesn't match the canonical hook's
          expected progress-object shape. Inline lifecycle state
          remained the path of least resistance during the v3 chrome
          adoption.

          UNLOCKS WHEN: same as ExportProgramDialog above — depends on
          the cross-editor state-contract harmonization. The 4
          SteppedProgressDrawer-using akai dialogs (ExportProgram,
          SendSample, ReceiveSample, DiskToLibrary) should migrate as
          a single batch so the gate accounts for them uniformly.
      - path: 'modules/akai-s3k-editor/src/components/library/DiskToLibraryDialog.tsx'
        reason: |
          WHAT: same migration as the three above — adopt the
          canonical `useExportDialogLifecycle` hook. DiskToLibraryDialog
          wraps SteppedProgressDrawer for the bulk Disk→Library import
          operation; it manages multi-item progress state (a
          per-item completion list, an aggregate progress index, and
          an item-level error map) atop the standard lifecycle state.

          WHY: the multi-item progress shape is the most divergent
          from the canonical hook's expectations. The hook treats
          progress as a single scalar/object; DiskToLibraryDialog's
          per-item state needs at least an extension point. Adopting
          the hook here without growing its contract would either lose
          per-item progress detail or require shadowing the hook's
          state with the dialog's own per-item state (defeating the
          point of adoption).

          UNLOCKS WHEN: the canonical hook grows multi-item progress
          support (a discriminated-union progress contract accepting
          either scalar progress or a per-item progress array), OR
          DiskToLibraryDialog's per-item state moves into a sibling
          composable (`useDiskBulkImport`) that the hook can consume.
          Either path is larger than Phase 2 task 2.3 scope.
    message: |
      Export-style dialogs/drawers with the shared lifecycle pattern
      (localError + hasStarted state, open-reset useEffect,
      isComplete/effectiveError/steps derivation, handleClose callback)
      should use the useExportDialogLifecycle hook (introduced in commit
      dce8fc72). Replace inline state + effect with
      `const { localError, setLocalError, hasStarted, setHasStarted,
      isComplete, effectiveError, steps, handleClose } =
      useExportDialogLifecycle({ open, isOperating, progress,
      operationError, onOpenChange });`

  - id: bank-header
    introduced_in: c88d8d06
    from: '@/components/common/BankHeader'
    # akai NOT in glob: akai lists are flat (no banks). The Akai
    # S3000XL organizes 128 programs / 128 samples in flat lists with
    # no 8-item grouping. See index.css:59-61 documenting the design:
    # "the Akai lists are flat (no banks) so a simple title eyebrow
    # is enough." This manifest stays roland-only as a NO-USE-CASE
    # disposition per Phase 2 task 2.3 cross-editor survey (2026-05-25).
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/patches/PatchList.tsx'
      - 'modules/roland-sxx0-editor/src/components/tones/ToneList.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/DeviceMemoryPanel.tsx'
    message: |
      Bank-row rendering (toggle button + chevron + bank label +
      slot-range readout + reload button) should use the shared
      BankHeader component (introduced in commit c88d8d06). Replace
      inline `.ac-list-bank-header` markup with `<BankHeader ... />`.

  - id: slot-info
    introduced_in: 30e7346e
    from: '@/components/common/SlotInfo'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/patches/PatchList.tsx'
      - 'modules/roland-sxx0-editor/src/components/tones/ToneList.tsx'
      # akai lists — added 2026-05-25 (Phase 2 task 2.3 cross-editor
      # backfill). All 3 lists render slot-number + name pairs inline
      # via <span className="ac-list-slot"> (ProgramList:187,
      # SampleList:193, KeygroupList:149). Migration to <SlotInfo>
      # primitive pending; tracked below.
      - 'modules/akai-s3k-editor/src/components/programs/ProgramList.tsx'
      - 'modules/akai-s3k-editor/src/components/samples/SampleList.tsx'
      - 'modules/akai-s3k-editor/src/components/keygroups/KeygroupList.tsx'
    tracked_holdouts:
      - path: 'modules/akai-s3k-editor/src/components/programs/ProgramList.tsx'
        reason: |
          WHAT: migrate akai ProgramList from inline slot-number + name
          pair rendering (line ~187: `<span
          className="ac-list-slot">{index + 1}</span>` + a sibling
          name span with `ac-list-info` chrome) to the canonical
          `<SlotInfo>` primitive (introduced commit 30e7346e). The
          canonical primitive owns the slot/name pair markup + the
          status-suffix slot + the disabled/empty state rendering;
          adoption deduplicates the 3 akai list components against
          the 2 roland list components that already render via
          SlotInfo.

          WHY: the migration touches every row render path in
          ProgramList (the row map, the keyboard-focus highlight, the
          disabled-when-empty branch). Extracting the slot rendering
          to SlotInfo requires either (a) reshaping the per-row data
          structure SlotInfo expects, or (b) growing SlotInfo with an
          akai-specific render variant — both larger than the Phase 2
          task 2.3 cross-editor backfill scope, which was confined to
          enumerating the holdout set rather than reworking render
          paths.

          UNLOCKS WHEN: a follow-up that touches ProgramList's row
          render path lands — most naturally bundled with a broader
          akai list-row primitive harmonization pass that aligns
          ProgramList + SampleList + KeygroupList against the
          canonical SlotInfo shape. Could be split per-list, but the
          three akai lists share enough structure that a single
          migration pass is more economical than three independent
          ones.
      - path: 'modules/akai-s3k-editor/src/components/samples/SampleList.tsx'
        reason: |
          WHAT: same migration as ProgramList above — adopt the
          canonical `<SlotInfo>` primitive in place of the inline
          slot-number + name pair (line ~193: `<span
          className="ac-list-slot">{index + 1}</span>` + name span).
          SampleList's row contract matches ProgramList's exactly
          (numeric slot index + name), so the migration shape is
          identical.

          WHY: same blocker as ProgramList — the row render path
          spans the row map, the keyboard-focus highlight, and the
          empty-sample state. Extraction needs either a row-data
          reshape or a SlotInfo variant; both larger than Phase 2
          task 2.3 backfill scope. The migration should land as a
          single pass alongside ProgramList + KeygroupList so the
          three akai lists adopt the primitive uniformly.

          UNLOCKS WHEN: bundled into the same akai list-row
          harmonization pass as ProgramList. The three lists' shared
          structure makes a single migration commit more economical
          than three independent ones.
      - path: 'modules/akai-s3k-editor/src/components/keygroups/KeygroupList.tsx'
        reason: |
          WHAT: same migration target as ProgramList + SampleList —
          adopt the canonical `<SlotInfo>` primitive. KeygroupList is
          the harder of the three because its slot label is
          semantically distinct: it renders "KG{i + 1}" (e.g., "KG1",
          "KG2") rather than the numeric "{i + 1}" used by Program
          and Sample lists. The label-format delta is a known
          adopter-side concern from the harmonization-spec.md slot-
          label semantics section.

          WHY: SlotInfo currently assumes numeric slot labels and
          doesn't expose a label-format callback. KeygroupList
          adoption needs either (a) a `labelFormatter?: (index:
          number) => string` prop on SlotInfo, or (b) a
          `KeygroupSlotInfo` thin wrapper that pre-formats the label
          and forwards to SlotInfo. Option (a) is cleaner but
          requires touching SlotInfo's API surface; option (b)
          requires a new file. Either path is a primitive-extraction
          decision the operator should weigh against the
          akai-harmonization Phase 3 surface area.

          UNLOCKS WHEN: a primitive-extraction dispatch picks one of
          the two adopter-side patterns and ships it as a single
          commit covering KeygroupList + any future per-editor
          consumers with non-numeric slot labels. Should land in the
          same akai list-row migration pass as ProgramList +
          SampleList so all three akai lists end up on SlotInfo
          uniformly.
    message: |
      Slot row info (name + status) should render via the SlotInfo
      component (introduced in commit 30e7346e). Replace inline
      `<span className="ac-list-info">` markup with `<SlotInfo ... />`.

  - id: ac-radio-tabs
    introduced_in: 1fa334f5
    # Promoted to editor-core in akai-harmonization Phase 2 task 2.2
    # (2026-05-24) so akai's VelocityZoneEditor (and future jv1080 /
    # d110 consumers) can adopt the canonical primitive without
    # duplicating it per-module. Multi-path `from:` recognizes adoption
    # via EITHER the post-promotion canonical path OR the pre-promotion
    # roland-local path during the transition (PR #462 / AUDIT-08).
    from:
      - '@audiocontrol/editor-core'
      - '@/components/common/AcRadioTabs'
    # Narrow recognition to the canonical symbol name (PR #463-era
    # `imports:` filter, commit 676dd164) so unrelated `@audiocontrol/
    # editor-core` imports in the same file don't accidentally satisfy
    # the gate.
    imports:
      - AcRadioTabs
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/patches/PatchEditorTabs.tsx'
      - 'modules/roland-sxx0-editor/src/components/tones/ToneEditorTabs.tsx'
      # akai VelocityZoneEditor — added in akai-harmonization Phase 2
      # task 2.2 (2026-05-24); first cross-editor consumer; uses
      # controlled mode because the VelocityRangeBar above the tabs
      # needs to read the active zone index.
      - 'modules/akai-s3k-editor/src/components/keygroups/VelocityZoneEditor.tsx'
    message: |
      Radio-driven tab strips should use the shared AcRadioTabs primitive
      (introduced in commit 1fa334f5; promoted to @audiocontrol/editor-core
      in akai-harmonization Phase 2 task 2.2 on 2026-05-24). Replace inline
      radio + nav + panels markup with `<AcRadioTabs tabs={...} panels={...}
      defaultTabId={...} groupName={...} ariaLabel={...} />`. For sibling-
      dependent tab strips (parent or sibling component needs the active
      tab id), use controlled mode: pass `activeId` + `onActiveIdChange`.

  - id: destination-eyebrow
    introduced_in: 81da20a9
    from: '@/components/library/DestinationEyebrow'
    # akai NOT in glob: akai's export/import dialogs auto-start
    # transfers on open — there is no pre-operation form phase where
    # a destination eyebrow ("Exporting to: …/library/programs/")
    # would render. Roland's export dialogs (ExportToneDialog,
    # ExportPatchDialog, BatchExportDrawer) render the eyebrow inside
    # their pre-execution form; akai dialogs (SteppedProgressDrawer
    # consumers) launch transfers immediately and report progress
    # only. NO-USE-CASE per Phase 2 task 2.3 cross-editor survey
    # (2026-05-25). If akai dialogs gain a pre-operation form phase
    # later, register akai files here at that time.
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/library/ExportToneDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ExportPatchDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/BatchExportDrawer.tsx'
    message: |
      Export-destination eyebrow row (kindLabel + LIBRARY + device-name)
      should use the DestinationEyebrow component (introduced in commit
      81da20a9). Replace inline 3-span eyebrow markup with
      `<DestinationEyebrow kindLabel={...} deviceName={...}
      itemCount={...} />`.

  - id: library-device-memory-panel-adapter
    introduced_in: dedd4d2f
    from: '@/plugins/shared/LibraryDeviceMemoryPanel'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/plugins/s330-library-plugin.tsx'
      - 'modules/roland-sxx0-editor/src/plugins/s550-library-plugin.tsx'
      # akai s3kLibraryPlugin — added 2026-05-25 (Phase 2 task 2.3
      # cross-editor backfill). The akai plugin has a hand-rolled
      # S3kMemoryPanelAdapter (s3k-library-plugin.tsx:62-107) wrapping
      # DeviceMemoryPanel with S3kMemoryPanelState — same shape as
      # roland's canonical adapter but with akai-specific state.
      # Migration to the canonical adapter requires state-contract
      # harmonization between S3kMemoryPanelState and the canonical's
      # DeviceMemoryCustomState shape. Tracked below.
      - 'modules/akai-s3k-editor/src/plugins/s3k-library-plugin.tsx'
    tracked_holdouts:
      - path: 'modules/akai-s3k-editor/src/plugins/s3k-library-plugin.tsx'
        reason: |
          WHAT: migrate akai's hand-rolled `S3kMemoryPanelAdapter`
          (s3k-library-plugin.tsx:62-107, ~46 lines) to the canonical
          `LibraryDeviceMemoryPanel` adapter from
          `@/plugins/shared/LibraryDeviceMemoryPanel` (introduced
