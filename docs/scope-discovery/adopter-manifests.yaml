# Adopter manifest registry — Phase 6 T6.2
#
# Pairs with `anti-patterns.yaml` (T6.1):
#   - anti-patterns find LEGACY shapes that should be REPLACED.
#   - adopter manifests find FILES that should be USING a canonical
#     primitive but aren't (regime-holdout / missing-adopter case).
#
# Each refactor commit that PROMOTES a primitive to a shared location
# (e.g., lifts `SlideDrawer` from one editor into `@/components/SlideDrawer`)
# SHOULD append an entry here naming the expected adopter set. The pre-
# commit gate (`make check-adopters`) walks the registry on every
# .ts/.tsx change and surfaces files matching the adopter glob but
# NOT importing the canonical `from` path. This closes the gap where
# the clone detector and the anti-pattern registry both miss the
# new-file-doesn't-adopt-the-extracted-primitive case.
#
# ──────────────────────────────────────────────────────────────────────────
# Schema
# ──────────────────────────────────────────────────────────────────────────
#
#   - id: <kebab-case-id; unique across the registry>
#     introduced_in: <commit-sha; 7-40 lowercase hex; the extraction commit>
#     from: <canonical import path; e.g., '@/components/SlideDrawer'>
#     expected_adopters_glob:
#       - <glob string; matched against repo-relative POSIX paths>
#       - <glob string>
#     exceptions:                  # optional; default empty
#       - path: <exact repo-relative path that matches one of the globs>
#         reason: |
#           <multi-line explanation for why this file legitimately
#            bypasses the primitive — e.g., "needs frame-rate scroll
#            lock that SlideDrawer doesn't expose">
#     tracked_holdouts:            # optional; default empty (AUDIT-06)
#       - path: <exact repo-relative path that matches one of the globs>
#         issue: <URL or '#issue-ref' of the tracking issue>
#         reason: |
#           <multi-line explanation naming the deferral context — e.g.,
#            "pending ROLAND-BUGFIX-V3-IMPORT; v3 SlideDrawer migration
#            deferred">
#     message: |
#       <multi-line replacement instruction shown when a holdout is found>
#
# ──────────────────────────────────────────────────────────────────────────
# Glob syntax (see tools/scope-discovery/util/glob.ts for the compiler)
# ──────────────────────────────────────────────────────────────────────────
#
#   - `**`        — any number of path segments (including zero)
#   - `*`         — any run of non-`/` characters within a segment
#   - `?`         — any single non-`/` character
#   - `{a,b,c}`   — alternation; non-nested; commas separate alternatives
#   - literal `/` — path separator (always forward-slash)
#
# Patterns are anchored against the full repo-relative path. Repo-relative
# paths are computed from the gate's `--root` flag (default: cwd).
#
# Exceptions: each exception `path` must match at least one of the
# manifest's `expected_adopters_glob` patterns. Exceptions whose path
# wouldn't be considered by the holdout calculation are rejected at
# parse time (they would be inert; the diagnostic is mechanical).
#
# Tracked holdouts (AUDIT-20260522-06): `tracked_holdouts:` is a
# distinct disposition from `exceptions:`. Tracked holdouts are files
# the operator KNOWS need to migrate but has explicitly deferred via a
# tracking issue. The gate exits 0 when only tracked-holdouts remain
# (no real holdouts); they appear under their own report section + the
# editor-symmetry matrix renders them as `⏳ A/E (T tracked)` instead
# of being masked as `✓`. Each entry MUST carry:
#   - `path:` (matches at least one glob, just like exceptions)
#   - `issue:` (URL containing `://` OR a `#`-prefixed GitHub-style ref;
#     prevents the field from being used as a "fix-it-later" dumping
#     ground without operator-tracked follow-up)
#   - `reason:` (multi-line explanation naming the deferral context)
# A path cannot appear in BOTH `exceptions:` and `tracked_holdouts:`
# for the same entry — these dispositions are mutually exclusive.
#
# Import detection: the gate matches `import ... from '<from>'`,
# `import('<from>')`, `export ... from '<from>'`, and
# `require('<from>')`. Both single- and double-quoted strings are
# accepted. The `<from>` value is escaped before insertion into the
# match regex, so meta characters in the canonical path (`/`, `.`, `@`)
# are matched literally.
#
# Engine choice (documented inline for future agents):
#   Glob-to-regex over `fast-glob` / `picomatch` / `globby`. None of
#   those packages are a direct dependency of this repo (they appear
#   only transitively); adding one for the narrow shapes adopter
#   manifests actually use widens the dep surface for marginal benefit.
#   The shape grammar (above) is small and finite; a 100-line compiler
#   beats a 2MB dep. Mirrors T6.1's pure-regex stance.
#
# Pre-commit hook (`make check-adopters`) walks this registry on every
# .ts/.tsx change and flags any holdouts. See
# `tools/scope-discovery/check-adopters.ts` for the gate.

adopter_manifests:
  # ────────────────────────────────────────────────────────────────────────
  # Backfilled 2026-05-22 from feature/roland-bugfix Phase 5. Covers the
  # 9 primitives extracted during Phase 2 plus the upstream SlideDrawer
  # primitive (whose 5 Import-dialog holdouts are tracked via the
  # ROLAND-BUGFIX-V3-IMPORT follow-up).
  #
  # Notes for the reader:
  # - The narrow-scope component primitives (BankHeader, SlotInfo,
  #   AcRadioTabs, DestinationEyebrow, LibraryDeviceMemoryPanel,
  #   LibraryPreviewPanelAdapter, AcReloadIcon) use literal-path globs
  #   to enumerate the current adopter set. Future expansions of the
  #   adopter set are operator-edits to the glob; the manifest then
  #   surfaces holdouts at the new locations.
  # - SlideDrawer's 5 Import dialogs are listed as exceptions with
  #   reason="pending ROLAND-BUGFIX-V3-IMPORT" because T6.2's schema
  #   doesn't yet distinguish "permanent exception" from "tracked-
  #   holdout-with-follow-up." See tooling-feedback.md §"Phase 5
  #   dogfooding" for the proposed `tracked_holdouts:` field.
  # ────────────────────────────────────────────────────────────────────────

  - id: page-title-row
    introduced_in: b996aa01
    from: '@/components/common/PageTitleRow'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/pages/PatchesPage.tsx'
      - 'modules/roland-sxx0-editor/src/pages/TonesPage.tsx'
      - 'modules/roland-sxx0-editor/src/pages/PlayPage.tsx'
    message: |
      Editor pages with a title row + LED metric + refresh affordance
      should render via the shared PageTitleRow primitive (introduced
      in commit b996aa01). Replace inline `<header className="ac-page-title-row">`
      markup with `<PageTitleRow headingId="..." headingText="..."
      metric={...} loadingMessage={...} isLoading={...} onRefresh={...}
      refreshLabel="..." />`.

  - id: use-export-dialog-lifecycle
    introduced_in: dce8fc72
    from: '@/hooks/useExportDialogLifecycle'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/library/ExportToneDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ExportPatchDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/BatchExportDrawer.tsx'
    message: |
      Export-style dialogs/drawers with the shared lifecycle pattern
      (localError + hasStarted state, open-reset useEffect,
      isComplete/effectiveError/steps derivation, handleClose callback)
      should use the useExportDialogLifecycle hook (introduced in commit
      dce8fc72). Replace inline state + effect with
      `const { localError, setLocalError, hasStarted, setHasStarted,
      isComplete, effectiveError, steps, handleClose } =
      useExportDialogLifecycle({ open, isOperating, progress,
      operationError, onOpenChange });`

  - id: bank-header
    introduced_in: c88d8d06
    from: '@/components/common/BankHeader'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/patches/PatchList.tsx'
      - 'modules/roland-sxx0-editor/src/components/tones/ToneList.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/DeviceMemoryPanel.tsx'
    message: |
      Bank-row rendering (toggle button + chevron + bank label +
      slot-range readout + reload button) should use the shared
      BankHeader component (introduced in commit c88d8d06). Replace
      inline `.ac-list-bank-header` markup with `<BankHeader ... />`.

  - id: slot-info
    introduced_in: 30e7346e
    from: '@/components/common/SlotInfo'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/patches/PatchList.tsx'
      - 'modules/roland-sxx0-editor/src/components/tones/ToneList.tsx'
    message: |
      Slot row info (name + status) should render via the SlotInfo
      component (introduced in commit 30e7346e). Replace inline
      `<span className="ac-list-info">` markup with `<SlotInfo ... />`.

  - id: ac-radio-tabs
    introduced_in: 1fa334f5
    from: '@/components/common/AcRadioTabs'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/patches/PatchEditorTabs.tsx'
      - 'modules/roland-sxx0-editor/src/components/tones/ToneEditorTabs.tsx'
    message: |
      Radio-driven tab strips should use the shared AcRadioTabs primitive
      (introduced in commit 1fa334f5). Replace inline radio + nav +
      panels markup with `<AcRadioTabs tabs={...} panels={...}
      defaultTabId={...} groupName={...} ariaLabel={...} />`.

  - id: destination-eyebrow
    introduced_in: 81da20a9
    from: '@/components/library/DestinationEyebrow'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/library/ExportToneDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ExportPatchDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/BatchExportDrawer.tsx'
    message: |
      Export-destination eyebrow row (kindLabel + LIBRARY + device-name)
      should use the DestinationEyebrow component (introduced in commit
      81da20a9). Replace inline 3-span eyebrow markup with
      `<DestinationEyebrow kindLabel={...} deviceName={...}
      itemCount={...} />`.

  - id: library-device-memory-panel-adapter
    introduced_in: dedd4d2f
    from: '@/plugins/shared/LibraryDeviceMemoryPanel'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/plugins/s330-library-plugin.tsx'
      - 'modules/roland-sxx0-editor/src/plugins/s550-library-plugin.tsx'
    message: |
      Per-device library plugins should render DeviceMemoryPanel via
      the shared LibraryDeviceMemoryPanel adapter (introduced in commit
      dedd4d2f). Replace inline `<DeviceMemoryPanel ...props-pass-through... />`
      with `<LibraryDeviceMemoryPanel state={state} />`.

  - id: library-preview-panel-adapter
    introduced_in: dedd4d2f
    from: '@/plugins/shared/LibraryPreviewPanelAdapter'
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/plugins/s330-library-plugin.tsx'
      - 'modules/roland-sxx0-editor/src/plugins/s550-library-plugin.tsx'
    message: |
      Per-device library plugins should render the preview panel via
      the shared LibraryPreviewPanelAdapter (introduced in commit
      dedd4d2f). Replace inline preview-routing function body with
      `<LibraryPreviewPanelAdapter selection={selection} context={context} />`.

  # ────────────────────────────────────────────────────────────────────────
  # Upstream SlideDrawer primitive (editor-core). The 5 Import dialogs are
  # tracked holdouts pending ROLAND-BUGFIX-V3-IMPORT
  # (https://github.com/audiocontrol-org/audiocontrol/issues/450).
  # T6.2's exceptions list is the only mechanism available for tracked-
  # deferred adopters; see tooling-feedback.md § "Phase 5 dogfooding —
  # T6.2 adopter manifests tracked-holdouts gap" for the proposed
  # `tracked_holdouts:` schema field.
  # ────────────────────────────────────────────────────────────────────────

  - id: slide-drawer-library-dialogs
    introduced_in: c41cf2a4
    from: '@audiocontrol/editor-core'
    # Cross-editor convention: every editor's library dialogs should use
    # the v3 SlideDrawer chrome from editor-core, not legacy Radix Dialog.
    # roland-sxx0-editor: 3 adopters + 5 tracked-holdouts (Import dialogs
    #   pending ROLAND-BUGFIX-V3-IMPORT, listed below as exceptions).
    # akai-s3k-editor: 0 adopters across 9 library dialogs — never adopted
    #   the v3 chrome. Listed below as exceptions with reason="out of
    #   scope for feature/roland-bugfix; ROLAND-BUGFIX-V3-AKAI follow-up
    #   recommended if/when akai adopts editor-core SlideDrawer."
    expected_adopters_glob:
      - 'modules/roland-sxx0-editor/src/components/library/ExportToneDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ExportPatchDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/BatchExportDrawer.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ImportLibraryToneDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ImportLibraryPatchDialog.tsx'
      - 'modules/roland-sxx0-editor/src/components/library/ImportSamplesDialog.tsx'
      # NOTE: ImportSampleDialog.tsx + ImportToneDialog.tsx were dead-code
      # orphans (defined but never mounted by LibraryPage — the production
      # path uses useLibraryImportDialogs + ImportLibraryToneDialog). Deleted
      # as part of V3-IMPORT (#450); adopter-glob entries dropped here.
      - 'modules/akai-s3k-editor/src/components/library/DiskToLibraryDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/DrumKitEditorDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ExportProgramDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ImportDrumKitDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ImportInstrumentDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ImportProgramDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/LibraryToDiskDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/ReceiveSampleDialog.tsx'
      - 'modules/akai-s3k-editor/src/components/library/SendSampleDialog.tsx'
    # T6.2/T6.3's `tracked_holdouts:` field shipped in commit caa132d9
    # (closes #453). The 5 Import dialog deferrals + 9 akai cross-editor
    # deferrals are now properly classified — gate passes AND the matrix
    # renders these as ⏳ instead of being masked as ✓.
    tracked_holdouts:
      # ImportLibraryToneDialog.tsx migrated to v3 SlideDrawer in
      # V3-IMPORT sub-task 2 of #450 — removed from tracked_holdouts.
      # ImportLibraryPatchDialog.tsx migrated to v3 SlideDrawer in
      # V3-IMPORT sub-task 4 of #450 — removed from tracked_holdouts.
      # All 3 production Import dialogs are now v3 SlideDrawer adopters;
      # V3-IMPORT is complete.
      # ImportSamplesDialog.tsx migrated to v3 SlideDrawer in
      # V3-IMPORT sub-task 3 of #450 — removed from tracked_holdouts.
      # ImportSampleDialog + ImportToneDialog were dead-code orphans
      # (defined but never JSX-mounted; the production path uses
      # useLibraryImportDialogs + ImportLibraryToneDialog). Deleted as
      # part of V3-IMPORT (#450); tracked_holdouts entries dropped.
      # akai-s3k-editor library dialogs (9 files) — all currently on legacy
      # Radix Dialog chrome. Cross-editor deferral; out of scope for
      # feature/roland-bugfix per the PRD. Recommend filing an
      # akai-side follow-up if/when akai-s3k-editor adopts v3 SlideDrawer.
      - path: 'modules/akai-s3k-editor/src/components/library/DiskToLibraryDialog.tsx'
        issue: '#cross-editor-akai-slidedrawer'
        reason: 'cross-editor — akai never adopted v3 SlideDrawer; out of scope for feature/roland-bugfix.'
      - path: 'modules/akai-s3k-editor/src/components/library/DrumKitEditorDialog.tsx'
        issue: '#cross-editor-akai-slidedrawer'
        reason: 'cross-editor — akai never adopted v3 SlideDrawer; out of scope for feature/roland-bugfix.'
      - path: 'modules/akai-s3k-editor/src/components/library/ExportProgramDialog.tsx'
        issue: '#cross-editor-akai-slidedrawer'
        reason: 'cross-editor — akai never adopted v3 SlideDrawer; out of scope for feature/roland-bugfix.'
      - path: 'modules/akai-s3k-editor/src/components/library/ImportDrumKitDialog.tsx'
        issue: '#cross-editor-akai-slidedrawer'
        reason: 'cross-editor — akai never adopted v3 SlideDrawer; out of scope for feature/roland-bugfix.'
      - path: 'modules/akai-s3k-editor/src/components/library/ImportInstrumentDialog.tsx'
        issue: '#cross-editor-akai-slidedrawer'
        reason: 'cross-editor — akai never adopted v3 SlideDrawer; out of scope for feature/roland-bugfix.'
      - path: 'modules/akai-s3k-editor/src/components/library/ImportProgramDialog.tsx'
        issue: '#cross-editor-akai-slidedrawer'
        reason: 'cross-editor — akai never adopted v3 SlideDrawer; out of scope for feature/roland-bugfix.'
      - path: 'modules/akai-s3k-editor/src/components/library/LibraryToDiskDialog.tsx'
        issue: '#cross-editor-akai-slidedrawer'
        reason: 'cross-editor — akai never adopted v3 SlideDrawer; out of scope for feature/roland-bugfix.'
      - path: 'modules/akai-s3k-editor/src/components/library/ReceiveSampleDialog.tsx'
        issue: '#cross-editor-akai-slidedrawer'
        reason: 'cross-editor — akai never adopted v3 SlideDrawer; out of scope for feature/roland-bugfix.'
      - path: 'modules/akai-s3k-editor/src/components/library/SendSampleDialog.tsx'
        issue: '#cross-editor-akai-slidedrawer'
        reason: 'cross-editor — akai never adopted v3 SlideDrawer; out of scope for feature/roland-bugfix.'
    message: |
      Library dialogs use the v3 SlideDrawer chrome from editor-core,
      not legacy Radix Dialog. Replace `<Dialog.Root>` + `<Dialog.Portal>`
      + `<Dialog.Overlay>` + `<Dialog.Content>` with `<SlideDrawer>`.
      The 5 Import dialogs are TRACKED HOLDOUTS pending
      ROLAND-BUGFIX-V3-IMPORT.
