          consumes akai-specific S3kPreviewCustomState. Migration gated
          on preview-state contract harmonization between roland's
          PreviewPanelCustomState and akai's S3kPreviewCustomState.
          Out of scope for Phase 2 task 2.3 backfill.
    message: |
      Per-device library plugins should render the preview panel via
      the shared LibraryPreviewPanelAdapter (introduced in commit
      dedd4d2f). Replace inline preview-routing function body with
