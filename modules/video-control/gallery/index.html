<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>audiocontrol -- Demo Video Gallery</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111827;
      color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 32px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f9fafb;
      letter-spacing: -0.01em;
    }

    header h1 span {
      color: #9ca3af;
      font-weight: 400;
    }

    #grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      max-width: 1520px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      #grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      #grid { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s ease;
      max-width: 480px;
      width: 100%;
      justify-self: center;
    }

    .card:hover {
      border-color: #4b5563;
    }

    .card-thumb {
      aspect-ratio: 16 / 9;
      background: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-placeholder {
      color: #6b7280;
      font-size: 0.875rem;
    }

    .card-info {
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f9fafb;
      flex: 1 1 auto;
    }

    .card-duration {
      font-size: 0.8rem;
      color: #9ca3af;
      font-variant-numeric: tabular-nums;
    }

    .card-links {
      width: 100%;
      display: flex;
      gap: 16px;
      margin-top: 4px;
    }

    .card-links a {
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.8rem;
    }

    .card-links a:hover {
      text-decoration: underline;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: #9ca3af;
      font-size: 0.95rem;
      padding: 80px 24px;
      line-height: 2;
    }

    .empty-state code {
      background: #1f2937;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #f9fafb;
    }
  </style>
</head>
<body>
  <header>
    <h1>audiocontrol <span>-- Demo Video Gallery</span></h1>
  </header>
  <div id="grid"></div>
  <script type="module" src="./gallery.ts"></script>
</body>
</html>
