<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>audiocontrol -- Demo Video Gallery</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111827;
      color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 32px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f9fafb;
      letter-spacing: -0.01em;
    }

    header h1 span {
      color: #9ca3af;
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-generate-all {
      background: #2563eb;
      color: #f9fafb;
      border: none;
      border-radius: 6px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-generate-all:hover {
      background: #1d4ed8;
    }

    .btn-generate-all:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
    }

    .generate-all-progress {
      font-size: 0.8rem;
      color: #93c5fd;
      display: none;
    }

    #grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      max-width: 1520px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      #grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      #grid { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s ease;
      max-width: 480px;
      width: 100%;
      justify-self: center;
    }

    .card:hover {
      border-color: #4b5563;
    }

    .card-thumb {
      aspect-ratio: 16 / 9;
      background: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-placeholder {
      color: #6b7280;
      font-size: 0.875rem;
    }

    .card-info {
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f9fafb;
      flex: 1 1 auto;
      text-decoration: none;
      display: block;
    }

    a.card-title:hover {
      color: #93c5fd;
    }

    .card-duration {
      font-size: 0.8rem;
      color: #9ca3af;
      font-variant-numeric: tabular-nums;
    }

    .card-links {
      width: 100%;
      display: flex;
      gap: 16px;
      margin-top: 4px;
    }

    .card-links a {
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.8rem;
    }

    .card-links a:hover {
      text-decoration: underline;
    }

    .card-link-finder {
      margin-left: auto;
      color: #6b7280;
    }

    .card-link-finder:hover {
      color: #93c5fd;
    }

    .btn-regen {
      background: none;
      border: 1px solid #374151;
      border-radius: 4px;
      color: #9ca3af;
      font-size: 0.8rem;
      padding: 2px 8px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .btn-regen:hover {
      color: #f9fafb;
      border-color: #4b5563;
    }

    .card.generating .card-thumb {
      opacity: 0.4;
    }

    .card-generating-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.85);
      pointer-events: none;
    }

    .card-thumb {
      position: relative;
    }

    .progress-panel {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      line-height: 1.4;
      color: #f9fafb;
    }

    .progress-step-icon {
      display: inline-block;
      width: 14px;
      text-align: center;
      flex-shrink: 0;
      font-size: 0.75rem;
    }

    .progress-step-label {
      flex: 1 1 auto;
    }

    .progress-step-elapsed {
      font-size: 0.72rem;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: #9ca3af;
      flex-shrink: 0;
    }

    .progress-step-done .progress-step-icon {
      color: #4ade80;
    }

    .progress-step-running .progress-step-icon {
      color: #60a5fa;
      animation: step-pulse 1.2s ease-in-out infinite;
    }

    .progress-step-pending {
      color: #6b7280;
    }

    .progress-footer {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #374151;
      font-size: 0.72rem;
      color: #9ca3af;
      font-family: ui-monospace, SFMono-Regular, monospace;
      text-align: center;
    }

    @keyframes step-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .card-error {
      width: 100%;
      font-size: 0.75rem;
      color: #f87171;
      margin-top: 4px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: #9ca3af;
      font-size: 0.95rem;
      padding: 80px 24px;
      line-height: 2;
    }

    .empty-state code {
      background: #1f2937;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #f9fafb;
    }

    /* Caption overlay */
    .caption-overlay {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 80%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 8px 16px;
      border-radius: 4px;
      pointer-events: none;
      text-align: center;
      line-height: 1.4;
      z-index: 10;
    }

    /* View toggle bar */
    .view-toggle-bar {
      display: flex;
      justify-content: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 8px;
    }

    .view-toggle-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #9ca3af;
      font-size: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2px 10px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .view-toggle-btn:hover {
      color: #d1d5db;
    }

    .view-toggle-btn.active {
      color: #f9fafb;
      border-bottom-color: #3b82f6;
    }

    /* Detail view */
    .detail-view {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .detail-back {
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .detail-back:hover {
      text-decoration: underline;
    }

    .detail-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f9fafb;
    }

    .detail-video-wrap {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .detail-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      background: #000;
    }

    .detail-metadata {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .detail-files {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      font-size: 0.8rem;
    }

    .detail-files a {
      color: #93c5fd;
      text-decoration: none;
    }

    .detail-files a:hover {
      text-decoration: underline;
    }

    .detail-files .file-size {
      color: #6b7280;
      margin-left: 4px;
    }

    .detail-section {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .detail-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .detail-section-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f9fafb;
    }

    .detail-save-btn {
      background: #2563eb;
      color: #f9fafb;
      border: none;
      border-radius: 4px;
      padding: 4px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .detail-save-btn:hover {
      background: #1d4ed8;
    }

    .detail-saved {
      color: #4ade80;
      font-size: 0.8rem;
      margin-left: 8px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .detail-saved.fade-out {
      opacity: 0;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .detail-table th {
      text-align: left;
      color: #9ca3af;
      font-weight: 500;
      padding: 6px 8px;
      border-bottom: 1px solid #374151;
    }

    .detail-table td {
      padding: 4px 8px;
      border-bottom: 1px solid #1f2937;
    }

    .detail-table input,
    .detail-table select {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 4px;
      color: #f9fafb;
      font-size: 0.8rem;
      padding: 4px 8px;
      width: 100%;
      font-family: inherit;
    }

    .detail-table input:focus,
    .detail-table select:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .detail-table .col-type { width: 20%; }
    .detail-table .col-in { width: 15%; }
    .detail-table .col-out { width: 15%; }
    .detail-table .col-text { width: 50%; }

    .detail-textarea {
      width: 100%;
      min-height: 200px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 4px;
      color: #f9fafb;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.8rem;
      padding: 12px;
      resize: vertical;
    }

    .detail-textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <header>
    <h1>audiocontrol <span>-- Demo Video Gallery</span></h1>
    <div class="header-actions">
      <button id="generate-all-btn" class="btn-generate-all">Generate All</button>
      <span id="generate-all-progress" class="generate-all-progress"></span>
    </div>
  </header>
  <div id="grid"></div>
  <script type="module" src="./gallery.ts"></script>
</body>
</html>
