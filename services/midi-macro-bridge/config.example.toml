# midi-macro-bridge config
#
# This file is read from one of these locations, in order:
#   1. Path passed via --config <path> on the command line
#   2. $MIDI_MACRO_BRIDGE_CONFIG environment variable
#   3. OS-conventional default:
#        macOS: ~/Library/Application Support/audiocontrol/midi-macro-bridge/config.toml
#        Linux: ~/.config/audiocontrol/midi-macro-bridge/config.toml
#   4. ./config.toml (current working directory — dev fallback)
#
# To install for the current user:
#   mkdir -p ~/.config/audiocontrol/midi-macro-bridge                       # Linux
#   mkdir -p ~/Library/Application\ Support/audiocontrol/midi-macro-bridge  # macOS
#   cp config.example.toml <path-above>/config.toml

# Substring match against the MC-500 transport MIDI input port
# (case-insensitive). Run with --list-ports to see available ports.
# Examples: "MC-500", "UM-ONE", "828mk3 Hybrid MIDI"
#
# If omitted, defaults to "828mk3 Hybrid MIDI" — a convenience for
# this project's primary rig. Set explicitly once your own MIDI
# interface name is stable.
midi_input_port = "828mk3 Hybrid MIDI"

# Substring match against the MIDI output port that reaches the
# MC-500's MIDI IN. Used for sync-on-stop: after LUNA snaps to its
# play-start position on Stop, the bridge sends SPP to the MC-500
# so both machines agree on where the playhead is.
#
# Default is the same name as midi_input_port (since a typical
# interface exposes inputs and outputs under the same name); midir
# resolves inputs and outputs as distinct endpoints. Set to an
# empty string to disable sync-on-stop.
mc500_output_port = "828mk3 Hybrid MIDI"

# Set to false to start in a disabled state (reserved for future use).
enabled_on_startup = true

[transport]
# Which output path the bridge uses to drive the DAW:
#
#   "mcu"         (default) — emits MCU control-surface messages on
#                 the bridge's virtual MIDI output. Works regardless
#                 of keyboard focus; no macOS Accessibility permission
#                 required. LUNA must have "MIDI Macro Bridge" selected
#                 in Preferences > Controllers > MIDI Control Surfaces
#                 as both INPUT and OUTPUT DEVICE on an enabled row
#                 (protocol: MCU).
#
#   "keystrokes"  — Phase 1-2 fallback. Synthesises keystrokes via
#                 enigo / macOS CGEvent. Requires LUNA to be frontmost
#                 and Accessibility permission granted to the binary.
#                 The keystroke_delay_ms and require_frontmost_app
#                 settings below only apply in this mode.
backend = "mcu"

# Delay in milliseconds between chained keystrokes.
# Only used when backend = "keystrokes".
keystroke_delay_ms = 20

# Only emit keystrokes when this app is frontmost.
# Prevents accidental Spacebar leaks into Safari, Finder, etc.
# Set to empty string to disable the check (not recommended).
# Only used when backend = "keystrokes".
require_frontmost_app = "LUNA"

[locate]
# Closed-loop locate: translates MC-500 SPP (Song Position Pointer)
# messages into bar-accurate jumps of LUNA's playhead. The bridge
# emits bar-nudge actions via the transport backend and watches
# LUNA's MCU position feedback to verify each step lands on the
# next bar. Iterates until the target is reached, or aborts cleanly
# on one of several safety outcomes (timeout, oscillation, cap).
#
# Requires the MCU backend (keystrokes backend has no position
# feedback). Requires LUNA's jog/scrub resolution = 1 bar.
#
# Enabled by default. If LUNA hasn't been configured as an MCU
# control surface, SPP events will time out cleanly with an
# actionable log message rather than misbehaving, so the default
# is safe. Set to false if you explicitly want the bridge to
# ignore SPP events entirely.
enabled = true

# Hard cap on bar-nudge iterations. At 1 bar per iteration this is
# also the maximum locate distance in bars. Raise if your songs are
# longer than this.
max_iterations = 128

# Per-iteration timeout in ms. If LUNA hasn't pushed a new bar
# value within this window after our nudge, abort. 500 ms has ~9x
# headroom over the ~55 ms observed during Phase 3c.
position_timeout_ms = 500

# Initial-position timeout in ms. Longer because LUNA pauses its
# position-display stream briefly during the MCU surface-init
# handshake after a bridge restart.
initial_position_timeout_ms = 3000

[lcxl3]
# Novation Launch Control XL Mk3 — second input source for the bridge,
# alongside the MC-500 transport input. When enabled, the bridge:
#
#   1. Opens the LCXL3's DAW Out / DAW In ports at startup.
#   2. Runs the full Live-equivalent DAW activation handshake so the
#      device's transport buttons start emitting (probe → Universal
#      Device Inquiry → claim → host-name SysEx → transport-LED preset).
#   3. Listens for transport-button presses (B0 74 7F = Play/Stop
#      toggle) and the transport encoder's relative ticks (B6 1E nn /
#      B6 1F nn) and feeds them into the same TransportEvent channel
#      the MC-500 input uses.
#   4. Mirrors transport state back to the device's Play LED on every
#      state change (green when playing, idle colour when stopped).
#   5. On Ctrl-C, sends the deactivation SysEx so the device returns
#      to its idle state.
#
# Disabled by default — explicit opt-in keeps existing MC-500-only
# behaviour unchanged. v1 only maps the Play/Stop button and the
# transport encoder; faders, V-pots, pads, and Record are unmapped.
#
# Power-cycling the LCXL3 mid-session breaks the connection; restart
# the bridge to re-handshake.
enabled = false

# Substring match against the LCXL3's DAW Out port (the device's
# output → bridge's input). Default matches Novation's macOS port name.
input_port = "LCXL3 1 DAW Out"

# Substring match against the LCXL3's DAW In port (bridge's output →
# device's input). The bridge sends the activation handshake and LED
# state to this port.
output_port = "LCXL3 1 DAW In"

# ASCII text shown on the device's display as the host-name string
# when it has nothing else to show. Mirrors what Live sends ("Live 12").
# Keep it short — the device's display has limited width.
host_name = "Bridge"

[lcxl3.mixer]
# Phase 9b — mixer control. When enabled (the default), the bridge puts
# the LCXL3 into DAW Mixer mode at startup by sending:
#
#   B6 1E 01    Surface mode → DAW Mixer
#   B6 45 7F    Row 1 encoders → relative mode (V-pot pan)
#   B6 48 7F    Row 2 encoders → relative mode
#   B6 49 7F    Row 3 encoders → relative mode
#   B6 46 7F    DAW Fader Pickup ON (catch mode for faders)
#
# Set to false to stay in DAW Control mode (Phase 5 default — transport
# buttons + jog wheel only) and skip these startup commands.
enabled = true

# Starting bank (0-indexed). 0 = LUNA tracks 1-8 visible on the LCXL3
# strips. The TrackLeft / TrackRight side buttons shift the bank window
# by 8 each press. Stages 5+ implement banking; this value is stored
# but not yet acted on in stages 2-4.
starting_bank = 0
