[package]
name = "midi-macro-bridge"
version = "0.4.0"
edition = "2021"
authors = ["Orion"]
description = "Translate MIDI events into keystrokes / macros. v1: Roland MC-500mkII transport to UAD LUNA."
license = "MIT OR Apache-2.0"

[dependencies]
midir = "0.10"
enigo = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = "3"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
rust-embed = "8"
mime_guess = "2"
serde_json = "1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
dirs = "5"
libc = "0.2"
# Virtual MCU endpoints on macOS go through CoreMIDI directly (not
# midir) so we can stamp stable UniqueIDs and DAWs like LUNA recognise
# the bridge across restarts. coremidi is already a transitive dep via
# midir on macOS; making it a direct dep is a no-op for the dep tree.
# Linux keeps midir's existing virtual-endpoint path via ALSA, with
# ephemeral UniqueIDs as a documented limitation. Windows is unsupported.
[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9"
tao = "0.30"
wry = "0.45"
tray-icon = "0.23.1"
png = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "midi-macro-bridge"
path = "src/main.rs"
